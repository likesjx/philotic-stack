[package]
name = "synthetic-broker-helper"
version = "0.1.0"
edition = "2024"
[dependencies]
ansible-mesh-core = { path = "vendor/ansible-mesh-core" }
aes-gcm = { version = "0.10", features = ["std"] }
base64 = "0.22"
anyhow = "1"
serde_json = "1"
uuid = { version = "1.21", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
libc = "0.2"
[workspace]
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
