name: PhiloticApp
options:
  bundleIdPrefix: com.philotic.apple
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PhiloticKit:
    path: ../PhiloticKit

targets:
  PhiloticApp-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PhiloticApp
    dependencies:
      - package: PhiloticKit
        product: PhiloticKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.mac
        PRODUCT_NAME: PhiloticApp
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhiloticApp uses the microphone for voice messages to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is transcribed on-device to send voice messages."

  PhiloticApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/PhiloticApp
    dependencies:
      - package: PhiloticKit
        product: PhiloticKit
    # HealthKit capability lives on the iOS target ONLY. The macOS target
    # (the build gate) gets no HealthKit entitlement — the service compiles
    # out its HealthKit surface under `#if os(iOS)` there.
    entitlements:
      path: PhiloticApp-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.ios
        PRODUCT_NAME: PhiloticApp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhiloticApp uses the microphone for voice messages to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is transcribed on-device to send voice messages."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "PhiloticApp reads your health metrics to build your life graph."
        TARGETED_DEVICE_FAMILY: "1,2"
        # Pinned to the Simulator SDK/platform (not iphoneos device) because this
        # dev environment's installed simulator runtime (iOS 26.2) trails the
        # Xcode-bundled device/SDK component (iOS 26.5), which the toolchain
        # reports as "not installed" for device builds. Device archiving is out
        # of scope for the v0 MVP; revisit if/when device builds are needed.
        SDKROOT: iphonesimulator
        SUPPORTED_PLATFORMS: iphonesimulator

schemes:
  PhiloticApp-macOS:
    build:
      targets:
        PhiloticApp-macOS: all
    run:
      config: Debug
    test:
      config: Debug
  PhiloticApp-iOS:
    build:
      targets:
        PhiloticApp-iOS: all
    run:
      config: Debug
    test:
      config: Debug
