name: PhiloticApp
options:
  bundleIdPrefix: com.philotic.apple
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PhiloticKit:
    path: ../PhiloticKit

targets:
  PhiloticApp-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/PhiloticApp
    dependencies:
      - package: PhiloticKit
        product: PhiloticKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.mac
        PRODUCT_NAME: PhiloticApp
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhiloticApp uses the microphone for voice messages to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is transcribed on-device to send voice messages."
        INFOPLIST_KEY_NSLocationUsageDescription: "PhiloticApp shares a location snapshot with your agents only when you tap Share Current Location."

  PhiloticApp-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    # Nested Info.plist dictionaries must be emitted as properties; an
    # INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking setting
    # does not produce an ATS dictionary in Xcode's generated app plist.
    info:
      path: PhiloticApp-iOS-Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAppTransportSecurity:
          NSExceptionDomains:
            # Transitional private vps-jane endpoint. Requires Tailscale on
            # the phone; remove this exception when the edge has HTTPS.
            "100.64.212.8":
              NSExceptionAllowsInsecureHTTPLoads: true
        NSLocalNetworkUsageDescription: "Connect to your configured Philotic server on your private network."
    sources:
      - path: Sources/PhiloticApp
    dependencies:
      - package: PhiloticKit
        product: PhiloticKit
    # HealthKit capability lives on the iOS target ONLY. The macOS target
    # (the build gate) gets no HealthKit entitlement — the service compiles
    # out its HealthKit surface under `#if os(iOS)` there.
    entitlements:
      path: PhiloticApp-iOS.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.ios
        PRODUCT_NAME: PhiloticApp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "PhiloticApp uses the microphone for voice messages to your agents."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Speech is transcribed on-device to send voice messages."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Review selected activity, sleep, and heart-rate summaries for personal wellness. Data stays on this device unless you separately confirm sharing summaries with your LifeGraph and agents."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "PhiloticApp shares a location snapshot with your agents only when you tap Share Current Location."
        TARGETED_DEVICE_FAMILY: "1,2"
        # Device-install ready. Automatic signing: open the project in Xcode,
        # select the PhiloticApp-iOS target -> Signing & Capabilities, and
        # pick your Team (a free Apple ID works; DEVELOPMENT_TEAM is left
        # blank on purpose so Xcode prompts rather than pinning a stale id).
        # A signed build is what makes the HealthKit permission prompt fire.
        # NOTE: SDKROOT is intentionally unset so Xcode chooses iphoneos vs
        # iphonesimulator from the selected run destination. On THIS dev Mac a
        # CLI `xcodebuild -scheme PhiloticApp-iOS` may still fail on the local
        # simulator-runtime version skew — build/run the iOS target from
        # Xcode against your device, not the CLI gate (which uses macOS).
        CODE_SIGNING_ALLOWED: "YES"
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: ""

  PhiloticAppTests-macOS:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/PhiloticAppTests
    dependencies:
      - target: PhiloticApp-macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.mac.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhiloticApp.app/Contents/MacOS/PhiloticApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

  PhiloticAppTests-iOS:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/PhiloticAppTests
    dependencies:
      - target: PhiloticApp-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.philotic.apple.ios.tests
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PhiloticApp.app/PhiloticApp"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  PhiloticApp-macOS:
    build:
      targets:
        PhiloticApp-macOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhiloticAppTests-macOS
  PhiloticApp-iOS:
    build:
      targets:
        PhiloticApp-iOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhiloticAppTests-iOS
