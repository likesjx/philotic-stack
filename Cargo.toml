[workspace]
members = [
    "crates/aiua",
    "crates/membrane-mcp",
    "crates/membrane-mcp-client",
    "crates/egress-http-runner",
    "crates/membrane",
    "crates/membrane-discord",
    "crates/membrane-telegram",
    "crates/philote",
    "crates/model-router",
    "crates/onnx-runner",
    "crates/tool-runner",
    "crates/philotic-client",
    "crates/philotic-edge-protocol",
    "crates/ansible-mesh-core",
    "crates/memory-core",
    "crates/philotic-web",
    "crates/philotic-sandbox",
    "crates/mlx-runner",
    "crates/media-prep",
    "crates/graph-intelligence",
    "crates/philotic-graph",
    "crates/datasource",
    "crates/graph-datasource",
    "crates/data-memorygraphrag",
    "crates/agent-datasource",
    "crates/router-listener",
    "crates/parakeet-runner",
    "crates/table-datasource",
    "crates/media-codec",
    "crates/perimeter-core",
    "crates/heal-dispatcher",
    "crates/exec-guard",
]
resolver = "2"

# Clippy ratchet — proposal:clippy-ratchet-workspace-lints.
#
# The workspace carries ~700 clippy warnings (aiua alone: 346), so a blanket
# `-D warnings` would be red on arrival and would only teach everyone to ignore
# the gate. Instead crates opt in ONE AT A TIME by adding
#
#     [lints]
#     workspace = true
#
# to their Cargo.toml. Opted-in crates then fail `cargo clippy` on any warning;
# the rest still only warn. Clean a crate, opt it in, and it can never regress.
#
# These are clippy-only lints, so `cargo build`/`cargo test` are unaffected —
# only `cargo clippy` enforces them.
[workspace.lints.clippy]
all = "deny"

# Build-artifact budget — see docs/guides/CARGO_BUILD_ARTIFACT_BUDGET.md.
#
# A `target/` for this workspace (605 deps, 32 members) reached 11 GB, and every
# parallel worktree pays that again. Debuginfo in the dev profile is the largest
# single term we control from the repo.
#
# NOTE: worktrees deliberately do NOT share one `target/` dir. Cargo fingerprints
# a unit by package name/version/profile/features — not by workspace path — so
# two worktrees of this repo collide: `cargo build` in worktree A reports
# "Finished" without rebuilding and leaves worktree B's binary at
# `target/debug/<bin>`. The 98 `${ROOT_DIR}/target/...` call sites in scripts/
# would then smoke-test the wrong build, silently. Share the *compiler cache*
# (sccache) instead — see the doc above.
#
# `line-tables-only` keeps file/line in panics and backtraces — which is how this
# stack is actually debugged (runtime logs, `sample`, smoke scripts) — and drops
# only variable inspection under a debugger. If you need lldb locals for a
# session, override for that build with CARGO_PROFILE_DEV_DEBUG=2.
[profile.dev]
debug = "line-tables-only"
