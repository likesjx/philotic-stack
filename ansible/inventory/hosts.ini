[philotic_hotels]
# jane-vps — first VPS hotel deployment
# SSH via public IP; inter-hotel mesh via Tailscale MagicDNS (transitional)
jane-vps ansible_user=deploy ansible_ssh_private_key_file=~/.ssh/vps_deploy_key

# Add additional hotel nodes here. Each node runs one hotel.
# Format: <host> ansible_user=<user> philotic_hotel_name=<name>

[philotic_hotels:vars]

# Backbone peers rendered as explicit Tailscale MagicDNS names.
# Fields: name, host, beacon_port.
# "host" carries the MagicDNS name today; will carry explicit IP:port when
# native hotel VPN replaces Tailscale.
# philotic_backbone_peers='[{"name": "jane-vps", "host": "jane-vps", "beacon_port": 8999}]'

# Per-host overrides live in host_vars/<hostname>.yml (see host_vars/jane-vps.yml.example)

[legacy_mesh_nodes]
# ZeroClaw-era nodes — do not apply philotic_hotel role here
# vps1.example.com ansible_user=root
