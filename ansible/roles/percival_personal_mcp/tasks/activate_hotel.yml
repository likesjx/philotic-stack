---
- name: Activate scoped supervisor with gateway-closure rescue
  block:
    - name: Reload scoped systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Start scoped vault socket before hotel exec
      ansible.builtin.systemd_service:
        name: percival-personal-vault.socket
        state: started
    - name: Restart hotel to adopt the scoped descriptor
      ansible.builtin.systemd_service:
        name: philotic-hotel.service
        state: restarted
    - name: Verify the running hotel before gateway activation
      ansible.builtin.import_tasks: verify_hotel.yml
      vars:
        percival_verify_running: true
  rescue:
    - name: Close gateway on any supervisor activation failure
      ansible.builtin.systemd_service:
        name: percival-personal-mcp.service
        state: stopped
    - name: Fail scoped rollout after gateway closure
      ansible.builtin.fail:
        msg: Scoped supervisor activation failed; gateway stopped. Operator review is required.
