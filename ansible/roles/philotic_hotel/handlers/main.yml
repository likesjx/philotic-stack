---
- name: Reload systemd
  systemd:
    daemon_reload: yes

- name: Restart philotic-hotel
  systemd:
    name: philotic-hotel
    state: restarted

- name: Restart philotic-memgraph
  systemd:
    name: philotic-memgraph
    state: restarted

- name: Restart philotic-onnx-sidecar
  systemd:
    name: philotic-onnx-sidecar
    state: restarted
