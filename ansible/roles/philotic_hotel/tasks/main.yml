---
# ── Prerequisites ──────────────────────────────────────────────────────────────

- name: Install system dependencies
  apt:
    name:
      - sqlite3
      - curl
      - ffmpeg
    state: present
    update_cache: yes
  when: ansible_facts["os_family"] == 'Debian'

- name: Check for existing Docker runtime
  stat:
    path: /usr/bin/docker
  register: philotic_docker_runtime
  when: philotic_memgraph_enabled | bool

- name: Install Docker for Memgraph
  apt:
    name:
      - docker.io
    state: present
    update_cache: yes
  when:
    - ansible_facts["os_family"] == 'Debian'
    - philotic_memgraph_enabled | bool
    - not philotic_docker_runtime.stat.exists

# ── Service user ───────────────────────────────────────────────────────────────

- name: Create philotic group
  group:
    name: "{{ philotic_group }}"
    system: yes

- name: Create philotic user
  user:
    name: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    system: yes
    shell: /sbin/nologin
    home: "{{ philotic_install_dir }}"
    create_home: no

# ── Filesystem layout ──────────────────────────────────────────────────────────

- name: Create install directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0755"
  loop:
    - "{{ philotic_install_dir }}"
    - "{{ philotic_bin_dir }}"
    - "{{ philotic_etc_dir }}"
    - "{{ philotic_data_dir }}"
    - "{{ philotic_blob_dir }}"

- name: Restrict etc directory (contains secrets)
  file:
    path: "{{ philotic_etc_dir }}"
    state: directory
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0700"

# ── Binary layout: release (/opt/philotic/current/bin) or legacy (bin_dir) ────
# Tagged `always` so --tags config / --skip-tags binary / --tags rollback runs
# render the unit against the same layout the host is actually in. Once a
# release has been installed the host stays in release mode until a deploy
# passes philotic_bin_layout=legacy (vps-deploy-ci, vps-push).

- name: Check for an existing release layout
  stat:
    path: "{{ philotic_current_link }}"
  register: philotic_current_stat
  tags: always

- name: Resolve binary layout
  set_fact:
    philotic_bin_layout_effective: >-
      {{ 'release' if (philotic_release_tag | default('') | length > 0)
         else (philotic_bin_layout if philotic_bin_layout in ['release', 'legacy']
         else ('release' if philotic_current_stat.stat.exists else 'legacy')) }}
  tags: always

- name: Refuse release layout without an installed release
  assert:
    that:
      - philotic_bin_layout_effective == 'legacy' or philotic_release_tag | length > 0 or philotic_current_stat.stat.exists
    fail_msg: >-
      philotic_bin_layout=release but {{ philotic_current_link }} does not exist and no
      philotic_release_tag was given. Install one first: just vps-deploy-release <tag>
  tags: always

- name: Resolve runtime bin dir
  set_fact:
    philotic_runtime_bin_dir: >-
      {{ (philotic_current_link ~ '/bin') if philotic_bin_layout_effective == 'release' else philotic_bin_dir }}
  tags: always

- name: Report binary layout
  debug:
    msg: "binary layout: {{ philotic_bin_layout_effective }} (runtime bin dir {{ philotic_runtime_bin_dir }})"
  tags: always

# ── Central graph database (optional Memgraph provider) ───────────────────────

- name: Create Memgraph data directory
  # Owned by the in-container memgraph user (uid 101 / gid 103), not root:
  # this directory IS the database. Memgraph writes its snapshots and WAL
  # here, and cannot start if it may not write.
  file:
    path: "{{ philotic_memgraph_data_dir }}"
    state: directory
    owner: "{{ philotic_memgraph_uid }}"
    group: "{{ philotic_memgraph_gid }}"
    mode: "0750"
  when: philotic_memgraph_enabled | bool

- name: Deploy Memgraph systemd unit
  template:
    src: philotic-memgraph.service.j2
    dest: /etc/systemd/system/philotic-memgraph.service
    mode: "0644"
  when: philotic_memgraph_enabled | bool
  notify:
    - Reload systemd
    - Restart philotic-memgraph

- name: Enable and start Memgraph
  systemd:
    name: philotic-memgraph
    enabled: yes
    state: started
    daemon_reload: yes
  when: philotic_memgraph_enabled | bool

# ── Binaries ───────────────────────────────────────────────────────────────────
# Binaries are delivered externally (rsync, artifact fetch, or CI distribution).
# This role only places them. Build is not the role's responsibility.
# philotic_artifacts_remote: false → copy from control machine (normal path)
# philotic_artifacts_remote: true  → copy from already-present path on the host (first-smoke path)
# These three tasks are the LEGACY layout (copy into philotic_bin_dir). In the
# release layout binaries come from a release tarball instead (release.yml).

- name: Copy Philotic binaries (from control machine)
  copy:
    src: "{{ philotic_artifacts_dir }}/{{ item }}"
    dest: "{{ philotic_bin_dir }}/{{ item }}"
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0755"
  loop: "{{ philotic_binaries }}"
  when:
    - philotic_bin_layout_effective == 'legacy'
    - not (philotic_artifacts_remote | bool)
  notify: Restart philotic-hotel
  tags: [binary]

- name: Check which remote Philotic binaries are available on host
  stat:
    path: "{{ philotic_artifacts_dir }}/{{ item }}"
  loop: "{{ philotic_binaries }}"
  register: philotic_remote_artifact_stats
  when:
    - philotic_bin_layout_effective == 'legacy'
    - philotic_artifacts_remote | bool
  tags: [binary]

- name: Warn about missing remote Philotic binaries
  debug:
    msg: >
      Skipping remote artifact {{ item.item }} because {{ philotic_artifacts_dir }}/{{ item.item }}
      is not present on the target host.
  loop: "{{ philotic_remote_artifact_stats.results }}"
  when:
    - philotic_bin_layout_effective == 'legacy'
    - philotic_artifacts_remote | bool
    - not item.stat.exists
  tags: [binary]

- name: Install Philotic binaries (already built on host)
  copy:
    src: "{{ philotic_artifacts_dir }}/{{ item }}"
    dest: "{{ philotic_bin_dir }}/{{ item }}"
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0755"
    remote_src: yes
  loop: >-
    {{
      philotic_remote_artifact_stats.results
      | selectattr('stat', 'defined')
      | selectattr('stat.exists')
      | map(attribute='item')
      | list
    }}
  when:
    - philotic_bin_layout_effective == 'legacy'
    - philotic_artifacts_remote | bool
  notify: Restart philotic-hotel
  tags: [binary]

# Release layout: unpack a verified release tarball, flip `current`, prune.
- name: Install release (release layout)
  import_tasks: release.yml
  tags: [binary]

# `--tags rollback` only (never runs in a normal deploy).
- name: Roll back to a previous release
  import_tasks: rollback.yml
  tags: [never, rollback]

# ── Config ─────────────────────────────────────────────────────────────────────

- name: Deploy mesh-config.json
  template:
    src: mesh-config.json.j2
    dest: "{{ philotic_etc_dir }}/mesh-config.json"
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0600"
  no_log: true
  notify: Restart philotic-hotel
  tags: [config]

# ── Agent workspace access ─────────────────────────────────────────────────────
# Grant the philotic user read access to any declared agent import_workspace paths.

- name: Grant philotic user read access to agent workspaces
  file:
    path: "{{ item.value.import_workspace }}"
    state: directory
    recurse: no
    mode: "o+rX"
  loop: "{{ philotic_agents | dict2items }}"
  when: item.value.import_workspace is defined
  no_log: true
  ignore_errors: yes

# ── Tailscale (transitional peer networking) ───────────────────────────────────

- name: Check if Tailscale is installed
  command: which tailscale
  register: tailscale_check
  failed_when: false
  changed_when: false

- name: Check if UFW is installed
  command: which ufw
  register: ufw_check
  failed_when: false
  changed_when: false

- name: Warn if Tailscale is not installed
  debug:
    msg: >
      WARNING: Tailscale is not installed. Inter-hotel mesh backbone peers will
      not resolve. Install Tailscale and authenticate before starting the hotel.
      (Tailscale is a transitional scaffold — see RH_ANSIBLE_VPS_DEPLOYMENT_PROPOSAL.md)
  when: tailscale_check.rc != 0

# ── Firewall ───────────────────────────────────────────────────────────────────
# Legacy ufw allow rules stay for hosts that run ufw; they are allow-only and
# never default-deny. The enforcing filter is the nftables table below
# (philotic_firewall_enabled), which drops untrusted traffic to hotel ports.

- name: Allow inter-hotel beacon port (UDP) via ufw
  ufw:
    rule: allow
    port: "{{ philotic_beacon_port }}"
    proto: udp
  when:
    - ansible_facts["os_family"] == 'Debian'
    - ufw_check.rc == 0

- name: Allow blob HTTP port (TCP, tailnet only) via ufw
  ufw:
    rule: allow
    port: "{{ philotic_blob_port }}"
    proto: tcp
    src: "100.64.0.0/10"  # Tailscale CGNAT range (transitional)
  when:
    - ansible_facts["os_family"] == 'Debian'
    - ufw_check.rc == 0

- name: Compute hotel ports to filter
  set_fact:
    philotic_firewall_tcp_ports: >-
      {{ ([philotic_hotel_port | int, philotic_hotel_port | int + 1, philotic_hotel_port | int + 2,
           philotic_blob_port | int, philotic_onnx_sidecar_port | int]
          + (philotic_firewall_extra_ports | map('int') | list)) | unique | list }}
    philotic_firewall_udp_ports: >-
      {{ ([philotic_beacon_port | int, philotic_hotel_port | int]
          + (philotic_firewall_extra_ports | map('int') | list)) | unique | list }}
  when: philotic_firewall_enabled | bool

- name: Install nftables
  apt:
    name: nftables
    state: present
  when:
    - philotic_firewall_enabled | bool
    - ansible_facts["os_family"] == 'Debian'

- name: Require nft for the hotel port filter
  command: nft --version
  register: nft_check
  changed_when: false
  failed_when: nft_check.rc != 0
  when: philotic_firewall_enabled | bool

- name: Deploy hotel port filter rules
  template:
    src: philotic-firewall.nft.j2
    dest: "{{ philotic_etc_dir }}/philotic-firewall.nft"
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  when: philotic_firewall_enabled | bool
  notify: Reload philotic firewall

- name: Install hotel port filter unit
  template:
    src: philotic-firewall.service.j2
    dest: /etc/systemd/system/philotic-firewall.service
    owner: root
    group: root
    mode: "0644"
  when: philotic_firewall_enabled | bool
  notify: Reload philotic firewall

- name: Enable hotel port filter
  systemd:
    name: philotic-firewall
    enabled: yes
    state: started
    daemon_reload: yes
  when: philotic_firewall_enabled | bool

- name: Remove hotel port filter when disabled
  systemd:
    name: philotic-firewall
    enabled: no
    state: stopped
  when: not (philotic_firewall_enabled | bool)
  failed_when: false

# ── Secrets ────────────────────────────────────────────────────────────────────

- name: Deploy secrets.env (from vault — never stored in plaintext in source control)
  template:
    src: secrets.env.j2
    dest: "{{ philotic_etc_dir }}/secrets.env"
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0600"
  no_log: true
  notify: Restart philotic-hotel
  tags: [config]

- name: Seed hotel graph/config from mesh-config.json
  command:
    argv:
      - runuser
      - -u
      - "{{ philotic_user }}"
      - --
      - sh
      - -lc
      - "set -a && . {{ (philotic_etc_dir ~ '/secrets.env') | quote }} && set +a && cd {{ philotic_data_dir | quote }} && {{ philotic_runtime_bin_dir | quote }}/aiua load --file {{ philotic_etc_dir | quote }}/mesh-config.json --hotel {{ philotic_hotel_runtime_name | quote }}"
  environment:
    PHILOTIC_BIN_DIR: "{{ philotic_runtime_bin_dir }}"
    PHILOTIC_HOTEL_SOCKET: "{{ philotic_hotel_socket }}"
    PHILOTIC_GRAPH_DATABASE_DIR: "{{ philotic_data_dir }}/graphs"
    PHILOTIC_TABLE_DB: "{{ philotic_data_dir }}/tables"
    PHILOTIC_ENABLE_RUST_AUTH: "{{ philotic_enable_rust_auth }}"
    PHILOTIC_ENABLE_RUST_DISPATCHER: "{{ philotic_enable_rust_dispatcher }}"
    PHILOTIC_ENABLE_RUST_TASK_LIFECYCLE: "{{ philotic_enable_rust_task_lifecycle }}"
    PHILOTIC_REMOTE_LIFE_GRAPH_RUNNER_NODE: "{{ philotic_remote_life_graph_runner_node }}"
  changed_when: false

- name: Remove stale records for previous hotel identities
  shell: |
    set -e
    sqlite3 {{ (philotic_data_dir ~ '/aiua_context.db') | quote }} <<'SQL'
    DELETE FROM graph_edges
      WHERE src_node_key = 'hotel:{{ item }}'
         OR dst_node_key = 'hotel:{{ item }}'
         OR src_node_key LIKE 'guest:{{ item }}:%'
         OR dst_node_key LIKE 'guest:{{ item }}:%'
         OR src_node_key LIKE 'config:%:{{ item }}'
         OR dst_node_key LIKE 'config:%:{{ item }}';
    DELETE FROM graph_nodes
      WHERE node_key = 'hotel:{{ item }}'
         OR node_key LIKE 'guest:{{ item }}:%'
         OR node_key LIKE 'config:%:{{ item }}'
         OR (kind = 'secret' AND data_json LIKE '%"scope":"hotel:{{ item }}"%')
         OR (kind = 'config' AND data_json LIKE '%"hotel_name":"{{ item }}"%');
    DELETE FROM materialized_guests
      WHERE hotel_name = '{{ item }}'
         OR guest_id LIKE '{{ item }}:%';
    DELETE FROM hotels
      WHERE hotel_name = '{{ item }}';
    DELETE FROM vault_secrets
      WHERE scope = 'hotel:{{ item }}';
    DELETE FROM mesh_events
      WHERE source_node_id = '{{ item }}-aiua-01'
         OR target_node_id = '{{ item }}-aiua-01';
    SQL
  args:
    executable: /bin/bash
  loop: "{{ philotic_hotel_previous_names }}"
  when: philotic_hotel_previous_names | length > 0
  changed_when: false

# ── systemd service ────────────────────────────────────────────────────────────

- name: Deploy philotic-hotel systemd unit
  template:
    src: philotic-hotel.service.j2
    dest: /etc/systemd/system/philotic-hotel.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart philotic-hotel
  tags: [config]

- name: Enable and start philotic-hotel
  systemd:
    name: philotic-hotel
    enabled: yes
    state: started
    daemon_reload: yes

# ── ONNX Sidecar (optional) ───────────────────────────────────────────────────

- name: Create HuggingFace cache directory for ONNX models
  file:
    path: "{{ philotic_data_dir }}/hf-cache"
    state: directory
    owner: "{{ philotic_user }}"
    group: "{{ philotic_group }}"
    mode: "0755"
  when: philotic_onnx_sidecar_enabled

- name: Deploy ONNX sidecar systemd unit
  template:
    src: philotic-onnx-sidecar.service.j2
    dest: /etc/systemd/system/philotic-onnx-sidecar.service
    mode: "0644"
  when: philotic_onnx_sidecar_enabled
  notify:
    - Reload systemd
    - Restart philotic-onnx-sidecar

- name: Enable and start ONNX sidecar
  systemd:
    name: philotic-onnx-sidecar
    enabled: yes
    state: started
    daemon_reload: yes
  when: philotic_onnx_sidecar_enabled

- name: Stop and disable ONNX sidecar when not enabled
  systemd:
    name: philotic-onnx-sidecar
    enabled: no
    state: stopped
  when: not philotic_onnx_sidecar_enabled
  ignore_errors: yes

- name: Allow ONNX sidecar port through ufw (tailnet only)
  ufw:
    rule: allow
    port: "{{ philotic_onnx_sidecar_port }}"
    proto: tcp
    src: "100.64.0.0/10"
  when:
    - ansible_facts["os_family"] == "Debian"
    - philotic_onnx_sidecar_enabled
    - ufw_check.rc == 0

# ── Muninn maintenance timer ────────────────────────────────────────────────
# Muninn prunes its own backup dir and (since the replication-log retention
# fix) its own log, but nothing retains the agent-driven nightly backups and
# nothing watches the store size. Reachability probes stayed green through a
# leak that grew the store from 311 MB to 20 GB.

- name: Install muninn maintenance script
  template:
    src: muninn-maintenance.sh.j2
    dest: /usr/local/bin/muninn-maintenance.sh
    owner: root
    group: root
    mode: "0755"
  when: muninn_enabled | default(true) | bool

- name: Install muninn maintenance systemd unit
  template:
    src: muninn-maintenance.service.j2
    dest: /etc/systemd/system/muninn-maintenance.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
  when: muninn_enabled | default(true) | bool

- name: Install muninn maintenance timer
  template:
    src: muninn-maintenance.timer.j2
    dest: /etc/systemd/system/muninn-maintenance.timer
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
  when: muninn_enabled | default(true) | bool

- name: Enable and start muninn maintenance timer
  systemd:
    name: muninn-maintenance.timer
    enabled: true
    state: started
    daemon_reload: true
  when: muninn_enabled | default(true) | bool

# ── Philotic heartbeat cleanup ───────────────────────────────────────────────
# The heartbeat now ticks inside the life-graph-runner (data-memorygraphrag),
# shipping with every build. Remove the retired systemd timer + script so a
# host deployed before the port doesn't keep a second sensor running.

- name: Stop and disable retired philotic heartbeat timer
  systemd:
    name: philotic-heartbeat.timer
    enabled: false
    state: stopped
  failed_when: false

- name: Remove retired philotic heartbeat files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/philotic-heartbeat.timer
    - /etc/systemd/system/philotic-heartbeat.service
    - /usr/local/bin/philotic-heartbeat.py
  notify:
    - Reload systemd
