---
# Deploy Philotic hotel daemon to VPS nodes.
#
# Usage:
#   ansible-playbook -i inventory/hosts.ini deploy_hotel.yml
#   ansible-playbook -i inventory/hosts.ini deploy_hotel.yml --limit jane-vps
#   ansible-playbook -i inventory/hosts.ini deploy_hotel.yml --tags config   # config-only, no rebuild
#
# Prerequisites on the control machine:
#   - ansible-vault password file or --ask-vault-pass
#   - SSH key at ~/.ssh/vps_deploy_key (or override ansible_ssh_private_key_file)
#   - host_vars/<hostname>.yml populated from host_vars/<hostname>.yml.example
#
# Prerequisites on each target host:
#   - Ubuntu 22.04+ (Debian family)
#   - Tailscale installed and authenticated (transitional peer networking)
#   - SSH access for deploy user with sudo

- name: Deploy Philotic Hotel
  hosts: philotic_hotels
  become: yes

  pre_tasks:
    - name: Load host vault vars
      include_vars: "vault/{{ inventory_hostname }}.yml"
      # Every role task that needs a vault_* var depends on this running first,
      # regardless of which --tags filter is given (binary, config, muninn, …).
      # Untagged pre_tasks are skipped by a --tags filter like any other task —
      # this is what made `--tags config` fail with vault vars undefined.
      tags: always

  roles:
    - role: philotic_hotel
    # Hotel deploys also re-enforce the MuninnDB hardened baseline so a full
    # rebuild can never regress muninn to open/default-password state
    # (proposal:muninn-vps-reharden). Restarts muninn only on config change.
    - role: muninn
      tags: [muninn]
