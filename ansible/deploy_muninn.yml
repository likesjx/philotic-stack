---
# Enforce the MuninnDB hardened baseline on VPS hotel nodes
# (proposal:muninn-vps-reharden). Safe to run any time: never touches the
# muninn data directory, restarts the daemon only when unit/env change.
#
# Usage:
#   ansible-playbook deploy_muninn.yml --limit jane-vps
#
# Secrets required in vault/<hostname>.yml:
#   vault_muninn_admin_password  (required, >=16 chars)
#   vault_muninn_mcp_token       (optional — gates MCP port 8750)

- name: Enforce MuninnDB hardened baseline
  hosts: philotic_hotels
  become: yes

  pre_tasks:
    - name: Load host vault vars
      include_vars: "vault/{{ inventory_hostname }}.yml"

  roles:
    - role: muninn
