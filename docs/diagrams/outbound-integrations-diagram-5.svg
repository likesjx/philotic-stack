        <text x="670" y="724" text-anchor="middle" fill="#1e293b" font-size="12">Allowlist claims and discard token material</text>
      </g>

      <g>
        <line x1="670" y1="788" x2="490" y2="788" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="580" y="780" text-anchor="middle" fill="#1e293b" font-size="12">Claims plus two content-free audits</text>
      </g>

      <g>
        <line x1="490" y1="844" x2="310" y2="844" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="400" y="836" text-anchor="middle" fill="#1e293b" font-size="12">Provider ID and allowlisted claims only</text>
      </g>

      <g>
        <line x1="310" y1="900" x2="490" y2="900" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="400" y="892" text-anchor="middle" fill="#1e293b" font-size="12">Link identity and issue operator session</text>
      </g>

      <g>
        <line x1="310" y1="956" x2="130" y2="956" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="220" y="948" text-anchor="middle" fill="#1e293b" font-size="12">Same-origin operator session</text>
      </g>
</svg>
