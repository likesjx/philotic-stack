<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1058" width="1340" height="1058" role="img" aria-label="Sequence diagram">
  <rect width="100%" height="100%" fill="#f8fafc" rx="14" />

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0b1220" />
    </marker>
  </defs>

      <g>
        <rect x="40" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="120" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">OperatorBrowser</text>
        <line x1="130" y1="98" x2="130" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="220" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="300" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">PhiloticWeb</text>
        <line x1="310" y1="98" x2="310" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="400" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="480" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">SourceHotel</text>
        <line x1="490" y1="98" x2="490" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
