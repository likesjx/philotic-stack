        <text x="760" y="388" text-anchor="middle" fill="#1e293b" font-size="12">Resolve client-secret reference</text>
      </g>

      <g>
        <line x1="850" y1="452" x2="670" y2="452" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="760" y="444" text-anchor="middle" fill="#1e293b" font-size="12">Client-secret value</text>
      </g>

      <g>
        <line x1="670" y1="508" x2="1030" y2="508" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="850" y="500" text-anchor="middle" fill="#1e293b" font-size="12">POST bounded token form</text>
      </g>

      <g>
        <line x1="1030" y1="564" x2="670" y2="564" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="850" y="556" text-anchor="middle" fill="#1e293b" font-size="12">Access and optional refresh tokens</text>
      </g>

      <g>
        <line x1="670" y1="620" x2="1210" y2="620" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="940" y="612" text-anchor="middle" fill="#1e293b" font-size="12">GET with runner-local bearer token</text>
      </g>

      <g>
        <line x1="1210" y1="676" x2="670" y2="676" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="940" y="668" text-anchor="middle" fill="#1e293b" font-size="12">Provider identity claims</text>
      </g>

      <g>
