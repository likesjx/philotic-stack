        <line x1="670" y1="98" x2="670" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="760" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="840" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">ExitVault</text>
        <line x1="850" y1="98" x2="850" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="940" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="1020" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">TokenEndpoint</text>
        <line x1="1030" y1="98" x2="1030" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="1120" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="1200" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">UserInfoEndpoint</text>
        <line x1="1210" y1="98" x2="1210" y2="1034" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <line x1="130" y1="116" x2="310" y2="116" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="220" y="108" text-anchor="middle" fill="#1e293b" font-size="12">OIDC callback with code and state</text>
      </g>

      <g>
        <line x1="310" y1="172" x2="310" y2="172" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="310" y="164" text-anchor="middle" fill="#1e293b" font-size="12">Validate state and recover PKCE verifier</text>
      </g>

      <g>
        <line x1="310" y1="228" x2="490" y2="228" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="400" y="220" text-anchor="middle" fill="#1e293b" font-size="12">Typed provider code verifier and exact redirect URI</text>
      </g>

      <g>
        <line x1="490" y1="284" x2="490" y2="284" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="490" y="276" text-anchor="middle" fill="#1e293b" font-size="12">Authorize exact web identity and compile local binding</text>
      </g>

      <g>
        <line x1="490" y1="340" x2="670" y2="340" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="580" y="332" text-anchor="middle" fill="#1e293b" font-size="12">Execute local-only OIDC exchange</text>
      </g>

      <g>
