<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 778" width="1160" height="778" role="img" aria-label="Sequence diagram">
  <rect width="100%" height="100%" fill="#f8fafc" rx="14" />
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0b1220" />
    </marker>
  </defs>
  
      <g>
        <rect x="40" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="120" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">Philote</text>
        <line x1="130" y1="98" x2="130" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="220" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="300" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">SourceHotel</text>
        <line x1="310" y1="98" x2="310" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="400" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="480" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">ExitHotel</text>
        <line x1="490" y1="98" x2="490" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="580" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="660" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">EgressRunner</text>
        <line x1="670" y1="98" x2="670" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="760" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="840" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">ExitVault</text>
        <line x1="850" y1="98" x2="850" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="940" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
        <text x="1020" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">ExternalAPI</text>
        <line x1="1030" y1="98" x2="1030" y2="754" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>
  
      <g>
        <line x1="130" y1="116" x2="310" y2="116" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="220" y="108" text-anchor="middle" fill="#1e293b" font-size="12">Execute binding scoped HTTP tool</text>
      </g>

      <g>
        <line x1="310" y1="172" x2="490" y2="172" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="400" y="164" text-anchor="middle" fill="#1e293b" font-size="12">Route binding request and return route</text>
      </g>

      <g>
        <line x1="490" y1="228" x2="670" y2="228" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="580" y="220" text-anchor="middle" fill="#1e293b" font-size="12">Deliver bounded execution task</text>
      </g>

      <g>
        <line x1="670" y1="284" x2="850" y2="284" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="760" y="276" text-anchor="middle" fill="#1e293b" font-size="12">Resolve credential reference</text>
      </g>

      <g>
        <line x1="850" y1="340" x2="670" y2="340" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="760" y="332" text-anchor="middle" fill="#1e293b" font-size="12">Credential value</text>
      </g>

      <g>
        <line x1="670" y1="396" x2="1030" y2="396" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="850" y="388" text-anchor="middle" fill="#1e293b" font-size="12">Validated request with injected credential</text>
      </g>

      <g>
        <line x1="1030" y1="452" x2="670" y2="452" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="850" y="444" text-anchor="middle" fill="#1e293b" font-size="12">HTTP response</text>
      </g>

      <g>
        <line x1="670" y1="508" x2="490" y2="508" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="580" y="500" text-anchor="middle" fill="#1e293b" font-size="12">Append secret free audit</text>
      </g>

      <g>
        <line x1="670" y1="564" x2="490" y2="564" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="580" y="556" text-anchor="middle" fill="#1e293b" font-size="12">Emit sanitized response to return route</text>
      </g>

      <g>
        <line x1="490" y1="620" x2="310" y2="620" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="400" y="612" text-anchor="middle" fill="#1e293b" font-size="12">Routed response</text>
      </g>

      <g>
        <line x1="310" y1="676" x2="130" y2="676" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
        <text x="220" y="668" text-anchor="middle" fill="#1e293b" font-size="12">Enriched tool result</text>
      </g>
</svg>
