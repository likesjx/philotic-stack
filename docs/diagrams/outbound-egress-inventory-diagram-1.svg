        <text x="660" y="78" text-anchor="middle" fill="#082f49" font-size="13" font-weight="600">OpenRouter</text>
        <line x1="670" y1="98" x2="670" y2="642" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <line x1="130" y1="116" x2="310" y2="116" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="220" y="108" text-anchor="middle" fill="#1e293b" font-size="12">Ensure system IntegrationBinding</text>
      </g>

      <g>
        <line x1="310" y1="172" x2="130" y2="172" stroke="#0b1220" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowhead)"/>
