        <text x="220" y="220" text-anchor="middle" fill="#1e293b" font-size="12">Emit bounded catalog task</text>
      </g>

      <g>
        <line x1="310" y1="284" x2="490" y2="284" stroke="#0b1220" stroke-width="1.8"  marker-end="url(#arrowhead)"/>
        <text x="400" y="276" text-anchor="middle" fill="#1e293b" font-size="12">Route task and return route</text>
      </g>

      <g>
