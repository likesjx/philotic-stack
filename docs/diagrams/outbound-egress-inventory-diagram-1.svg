        <line x1="310" y1="98" x2="310" y2="642" stroke="#94a3b8" stroke-dasharray="6 5"/>
      </g>

      <g>
        <rect x="400" y="56" width="160" height="34" rx="8" fill="#ecfeff" stroke="#0ea5e9" />
