<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620">
<defs>
  <style>text { font-family: Inter, system-ui, -apple-system, sans-serif; }</style>
</defs>
<rect width="840" height="620" fill="#0a0c14"/>

<!-- ═══════ HEADER ═══════ -->
<circle cx="40" cy="40" r="16" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.9"/>
<text x="40" y="44" text-anchor="middle" font-size="14" fill="#00e5ff">&#x2B21;</text>
<text x="65" y="45" font-size="16" font-weight="700" fill="#e8eaf0">Philotic Stack <tspan fill="#00e5ff">Mental Model</tspan></text>

<!-- ═══════ THE HOTEL (Node Authority) ═══════ -->
<rect x="220" y="90" width="400" height="380" rx="12" fill="#00e5ff" fill-opacity="0.03" stroke="#00e5ff" stroke-opacity="0.4" stroke-width="1.5"/>
<text x="232" y="112" font-size="11" font-weight="700" letter-spacing="1" fill="#00e5ff" text-anchor="start" style="text-transform:uppercase">The Hotel (Node Authority)</text>

<!-- Context Graph — inside hotel, left -->
<rect x="260" y="180" width="150" height="120" rx="8" fill="#161b2e" stroke="#ffc107" stroke-width="1"/>
<text x="335" y="236" font-size="24" text-anchor="middle">📀</text>
<text x="335" y="280" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Context Graph</text>
<text x="335" y="293" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">SQLite (Source of Truth)</text>

<!-- Memory Core (Muninn) — inside hotel, right -->
<rect x="430" y="180" width="150" height="120" rx="8" fill="#161b2e" stroke="#d500f9" stroke-width="1"/>
<text x="505" y="236" font-size="24" text-anchor="middle">🔮</text>
<text x="505" y="280" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Memory Core</text>
<text x="505" y="293" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">Muninn (Cognitive Memory)</text>

<!-- Dotted line between Context Graph and Memory Core -->
<line x1="410" y1="240" x2="430" y2="240" stroke="#8892b0" stroke-width="1" stroke-dasharray="3,2" opacity="0.5"/>

<!-- ═══════ MEMBRANE (External Gateway) — outside hotel, left ═══════ -->
<rect x="40" y="200" width="130" height="120" rx="8" fill="#161b2e" stroke="#d500f9" stroke-width="1"/>
<text x="105" y="256" font-size="24" text-anchor="middle">🌐</text>
<text x="105" y="300" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Membrane</text>
<text x="105" y="313" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">External Gateway</text>

<!-- Connection: Membrane → Hotel (IPC) -->
<line x1="170" y1="260" x2="220" y2="260" stroke="#00e5ff" stroke-width="1.5"/>
<rect x="172" y="247" width="52" height="14" rx="4" fill="#0a0c14" opacity="0.9"/>
<text x="198" y="258" font-size="7.5" font-weight="700" fill="#8892b0" text-anchor="middle">IPC (UDS)</text>

<!-- External World — above Membrane -->
<line x1="105" y1="200" x2="105" y2="100" stroke="#8892b0" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="70" y="142" width="70" height="16" rx="4" fill="#0a0c14" opacity="0.8"/>
<text x="105" y="154" font-size="8" font-weight="700" fill="#8892b0" text-anchor="middle">External World</text>
<text x="105" y="80" font-size="10" fill="#8892b0" text-anchor="middle" font-weight="600">Telegram / Nostr / API</text>

<!-- ═══════ AGENT-CORE (Cognitive Loop) — outside hotel, right ═══════ -->
<rect x="680" y="150" width="130" height="120" rx="8" fill="#161b2e" stroke="#00e676" stroke-width="1"/>
<text x="745" y="206" font-size="24" text-anchor="middle">🧠</text>
<text x="745" y="250" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Agent-Core</text>
<text x="745" y="263" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">Cognitive Loop</text>

<!-- Connection: Hotel → Agent-Core (IPC) -->
<line x1="620" y1="210" x2="680" y2="210" stroke="#00e5ff" stroke-width="1.5"/>
<rect x="624" y="197" width="52" height="14" rx="4" fill="#0a0c14" opacity="0.9"/>
<text x="650" y="208" font-size="7.5" font-weight="700" fill="#8892b0" text-anchor="middle">IPC (UDS)</text>

<!-- ═══════ MODEL-ROUTER (LLM Inference) — outside hotel, right below ═══════ -->
<rect x="680" y="300" width="130" height="120" rx="8" fill="#161b2e" stroke="#2979ff" stroke-width="1"/>
<text x="745" y="356" font-size="24" text-anchor="middle">🤖</text>
<text x="745" y="400" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Model-Router</text>
<text x="745" y="413" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">LLM Inference</text>

<!-- Connection: Hotel → Model-Router (IPC) -->
<line x1="620" y1="360" x2="680" y2="360" stroke="#00e5ff" stroke-width="1.5"/>
<rect x="624" y="347" width="52" height="14" rx="4" fill="#0a0c14" opacity="0.9"/>
<text x="650" y="358" font-size="7.5" font-weight="700" fill="#8892b0" text-anchor="middle">IPC (UDS)</text>

<!-- ═══════ DESKTOP MEMBRANE (Operator Surface) — outside hotel, bottom-left ═══════ -->
<rect x="40" y="380" width="130" height="120" rx="8" fill="#161b2e" stroke="#1de9b6" stroke-width="1"/>
<text x="105" y="436" font-size="24" text-anchor="middle">🖥️</text>
<text x="105" y="476" font-size="11" font-weight="600" fill="#e8eaf0" text-anchor="middle">Desktop Membrane</text>
<text x="105" y="489" font-size="9" fill="#8892b0" text-anchor="middle" font-family="JetBrains Mono, monospace">Operator Surface</text>

<!-- Connection: Desktop Membrane → Hotel (HTTP/WS) -->
<line x1="170" y1="420" x2="220" y2="400" stroke="#1de9b6" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="168" y="400" width="56" height="14" rx="4" fill="#0a0c14" opacity="0.9"/>
<text x="196" y="411" font-size="7.5" font-weight="700" fill="#8892b0" text-anchor="middle">HTTP/WS</text>

<!-- ═══════ PEER HOTEL NODES (Mesh) — bottom center ═══════ -->
<rect x="260" y="530" width="320" height="48" rx="12" fill="#d500f9" fill-opacity="0.06" stroke="#d500f9" stroke-opacity="0.4" stroke-width="1.5" stroke-dasharray="6,3"/>
<text x="420" y="560" font-size="11" font-weight="700" letter-spacing="1" fill="#d500f9" text-anchor="middle" style="text-transform:uppercase">Peer Hotel Nodes (Mesh)</text>

<!-- Connection: Hotel → Mesh (PHILOTIC WEB) -->
<line x1="420" y1="470" x2="420" y2="530" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="5,3"/>
<rect x="385" y="492" width="70" height="16" rx="4" fill="#0a0c14" opacity="0.8"/>
<text x="420" y="504" font-size="8" font-weight="700" fill="#8892b0" text-anchor="middle">PHILOTIC WEB</text>

<!-- ═══════ LEGEND (bottom-right) ═══════ -->
<text x="700" y="520" font-size="8" font-weight="600" fill="#8892b0" letter-spacing="0.5">LEGEND</text>
<line x1="700" y1="532" x2="720" y2="532" stroke="#00e5ff" stroke-width="1.5"/>
<text x="724" y="535" font-size="7.5" fill="#8892b0">IPC (UDS)</text>
<line x1="700" y1="548" x2="720" y2="548" stroke="#1de9b6" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="724" y="551" font-size="7.5" fill="#8892b0">HTTP / WS</text>
<line x1="700" y1="564" x2="720" y2="564" stroke="#d500f9" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="724" y="567" font-size="7.5" fill="#8892b0">Philotic Web</text>
<line x1="700" y1="580" x2="720" y2="580" stroke="#8892b0" stroke-width="1.5" stroke-dasharray="5,3"/>
<text x="724" y="583" font-size="7.5" fill="#8892b0">External</text>

</svg>