name: Native preapproval exact issuer qualification
on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/native-preapproval-real-issuer.yml'
      - 'crates/aiua/src/service/native_authority/runtime/composition.rs'
permissions:
  contents: read
  actions: read
jobs:
  native-package:
    # Older host kernel for the pinned Mongo; Ubuntu24 container supplies the
    # GLIBC_2.39 userland required by the already published Rust artifact.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RUNTIME_SHA: 1b48281d7c3630402086df30d8dfcaac979b1d0a
      ISSUER_SHA: 0fe29c7714b75cef4251415b25e668c8121ed437
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: likesjx/jaredlikes-com
          ref: ${{ env.ISSUER_SHA }}
          path: issuer
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: likesjx/philotic-stack
          ref: ${{ github.event.pull_request.head.sha }}
          path: hotel
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: hotel
          cache-on-failure: true
      - name: Install existing shell-boundary test dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh
          zsh --version
      - name: Build current issuer and test-only HTTP adapter
        working-directory: issuer
        run: |
          npm ci
          npm test
          npm run typecheck
          node_modules/.bin/tsc -p tsconfig.authority.json
          python3 -B -m unittest discover -s ops/ansible/issuer -p 'test_*.py'
          node ops/ansible/lifegraph/build-authority.cjs ../authority
          node_modules/.bin/esbuild ops/ansible/lifegraph/native-package-fixture.mts --bundle --platform=node --format=cjs --outfile=../fixture.cjs
      - name: Fetch and verify exact qualified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir inputs candidate
          gh api repos/likesjx/philotic-stack/actions/artifacts/13195140377/zip > inputs/native.zip
          echo 'dfb85bd4a37f2cd7a765fa0237e81da3309be026e82c056cba13c7751e44c981  inputs/native.zip' | sha256sum -c
          unzip -q inputs/native.zip -d inputs/native
          echo '8cd439ddeb0994cfd6043b5bd6470a7038fcbd399d1b6c8350fcc73994097239  inputs/native/native-memory-1b48281d7c3630402086df30d8dfcaac979b1d0a-linux-x86_64.tar.gz' | sha256sum -c
          tar -xzf inputs/native/native-memory-1b48281d7c3630402086df30d8dfcaac979b1d0a-linux-x86_64.tar.gz -C candidate
          python3 hotel/scripts/release-manifest.py verify --dir candidate
          python3 - <<'PYVERIFY'
          import json, os, pathlib
          manifest = json.loads(pathlib.Path('candidate/manifest.json').read_text())
          provenance = json.loads(pathlib.Path('candidate/provenance.json').read_text())
          assert manifest['sha'] == provenance['sha'] == os.environ['RUNTIME_SHA']
          assert manifest['target'] == provenance['target'] == 'x86_64-unknown-linux-gnu'
          assert provenance['run_url'] == 'https://github.com/likesjx/philotic-stack/actions/runs/41553265667'
          PYVERIFY
          curl --fail --silent --show-error --max-time 120 https://nodejs.org/dist/v24.22.0/node-v24.22.0-linux-x64.tar.xz -o inputs/node.tar.xz
          echo 'cc2f601cee82d9a5a233302fe307abc600727035fd7d2c3a3571755989e95008  inputs/node.tar.xz' | sha256sum -c
          tar -xJf inputs/node.tar.xz -C inputs
      - name: Compile Linux test driver only
        working-directory: hotel
        run: |
          cargo test --locked -p aiua --no-run --message-format=json > ../test-build.jsonl
          python3 - <<'PY'
          import json,pathlib,shutil
          rows=[json.loads(l) for l in pathlib.Path('../test-build.jsonl').read_text().splitlines() if l.startswith('{')]
          paths=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('profile',{}).get('test') and r.get('executable') and r['target']['name']=='aiua']
          assert len(paths)==1, paths
          shutil.copy2(paths[0],'../inputs/driver')
          PY
      - name: Effective authenticated pilot Mongo privilege tests
        working-directory: issuer
        run: node_modules/.bin/tsx scripts/test-authority-pilot-privileges.mts
      - name: Prepare disposable official Linux userland
        run: |
          cat > inputs/Dockerfile <<'EOF'
          FROM ubuntu:24.04
          RUN apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates openssl libssl3t64 libsqlite3-0 zlib1g systemd && rm -rf /var/lib/apt/lists/*
          EOF
          docker build -t native-issuer-userland inputs
      - name: Start isolated synthetic databases
        run: |
          set -euo pipefail
          docker network create --internal native-package-bridge
          docker run -d --name native-package-network --network native-package-bridge --cap-drop ALL --security-opt no-new-privileges --memory 64m --pids-limit 16 native-issuer-userland sleep 1800
          docker run -d --name native-package-mongo --network container:native-package-network --user 999:999 --entrypoint mongod --tmpfs /data/db:rw,uid=999,gid=999 --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 1 --pids-limit 128 --log-opt max-size=10m --log-opt max-file=3 mongo@sha256:d0d926f94df099bff534b7ee5b5986458131a22489dfff8664509af0c1e2ca9c --auth --bind_ip 127.0.0.1 --port 27018
          docker run -d --name native-package-graph --network container:native-package-network --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 256 --log-opt max-size=10m --log-opt max-file=3 memgraph/memgraph-mage@sha256:e8e03640071c57de6a13f2f4c5f9ed1789797dc5e8e771bbe62203b20e1b8c27 --bolt-address=127.0.0.1 --bolt-port=17687 --storage-wal-enabled=true --storage-wal-file-flush-every-n-tx=1 --storage-snapshot-interval-sec=300 --storage-snapshot-on-exit=true --telemetry-enabled=false
          python3 - <<'PY'
          import subprocess,time
          for attempt in range(60):
            if subprocess.run(['docker','exec','native-package-mongo','mongosh','--port','27018','--quiet','--eval','db.adminCommand({ping:1})'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL,timeout=5).returncode==0: break
            time.sleep(1)
          else: raise RuntimeError('synthetic Mongo readiness failed')
          PY
          ready=false
          for i in {1..60}; do
            if docker exec -i native-package-graph mgconsole --host 127.0.0.1 --port 17687 <<< 'RETURN 1;' >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          docker exec -i native-package-mongo mongosh --port 27018 --quiet --eval 'if(db.getSiblingDB("admin").runCommand({createUser:"fixture-root",pwd:"synthetic-fixture-only",roles:["root"]}).ok!==1)throw Error("bootstrap failed");'
          docker exec -i native-package-graph mgconsole --host 127.0.0.1 --port 17687 <<'CYPHER'
          CREATE CONSTRAINT ON (n:NativeMemoryObservation) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryReceipt) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryNonce) ASSERT n.key IS UNIQUE;
          CYPHER
      - name: Configure dedicated Traefik mTLS bridge fixture
        run: |
          BRIDGE_IP=$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' native-package-network)
          python3 issuer/ops/ansible/lifegraph/native-bridge-fixture.py "$PWD/bridge" "$BRIDGE_IP"
          echo "PHILOTIC_MCP_TLS_BIND=$BRIDGE_IP" >> "$GITHUB_ENV"
          docker run -d --name native-package-proxy --user "$(id -u):$(id -g)" --network native-package-bridge --cap-drop ALL --security-opt no-new-privileges --read-only --memory 128m --cpus 1 --pids-limit 64 --mount "type=bind,src=$PWD/bridge/proxy,dst=/fixture,readonly" traefik@sha256:74fe8a2e317dbfbdca113347633b44a00a11d57170bc01147c150469418a4bc3 --entrypoints.websecure.address=:8443 --providers.file.filename=/fixture/dynamic.json --global.checknewversion=false --global.sendanonymoususage=false --log.level=ERROR
      - name: Load exact current issuer image without rebuilding or registry authentication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api repos/likesjx/jaredlikes-com/actions/artifacts/13182062405/zip > inputs/website.zip
          echo '02488c919ffdc4308dfa7be2aa212a8f58f2eaef8cdecf954c9c533557f574bd  inputs/website.zip' | sha256sum -c
          unzip -q inputs/website.zip -d inputs/website
          echo '55092e241c4c507e162003db173b205f125fb009f2d689a5d3091a2c17e668bb  inputs/website/native-website-image.tar.gz' | sha256sum -c
          docker load -i inputs/website/native-website-image.tar.gz
          test "$(docker image inspect native-website:composed --format '{{.Id}}')" = sha256:6b5bc8a2039ad550d0e7c2c53303dfdc6ba2db059b8ad7afbea8359963650b57
          test "$(docker image inspect native-website:composed --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$ISSUER_SHA"
          test "$(docker image inspect native-website:composed --format '{{.Os}}/{{.Architecture}}')" = linux/amd64
          cmp authority/authority.cjs inputs/website/authority.cjs
      - name: Start exact isolated website fixture
        run: |
          mkdir -p "$RUNNER_TEMP/native-shared/website-custody"
          touch "$RUNNER_TEMP/native-shared/native-website-enabled"
          docker run -d --name native-package-website --user "$(id -u):$(id -g)" --network container:native-package-network --cap-drop ALL --security-opt no-new-privileges --memory 1g --cpus 2 --pids-limit 128 --log-opt max-size=10m --log-opt max-file=3 --mount "type=bind,src=$RUNNER_TEMP/native-shared/website-custody,dst=/run/native-test,readonly" --entrypoint node native-website:composed -e '
            const fs=require("fs"),cp=require("child_process");let count=0;const timer=setInterval(()=>{if(++count>600)process.exit(1);if(!fs.existsSync("/run/native-test/env.json"))return;clearInterval(timer);const env=JSON.parse(fs.readFileSync("/run/native-test/env.json","utf8"));const child=cp.spawn(process.execPath,["server.js"],{stdio:"inherit",env:{...process.env,...env}});process.on("SIGTERM",()=>child.kill("SIGTERM"));child.on("exit",code=>process.exit(code??1));},100);'
      - name: Actual packaged hotel and issuer through native remember recall
        run: |
          set -euo pipefail
          docker run --name native-package-runtime --user "$(id -u):$(id -g)" --network container:native-package-network --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 256 --log-opt max-size=10m --log-opt max-file=3 \
            --mount "type=bind,src=$PWD,dst=/fixture,readonly" --mount "type=bind,src=$RUNNER_TEMP/native-shared,dst=/tmp" \
            -e CI=true -e GITHUB_ACTIONS=true -e PHILOTIC_NATIVE_OAUTH_COMPOSITION=1 -e PHILOTIC_TEST_PREAPPROVAL_RENEWAL=1 -e PHILOTIC_MCP_TLS_BIND="$PHILOTIC_MCP_TLS_BIND" \
            -e PHILOTIC_TEST_BIN_DIR=/fixture/candidate/bin \
            -e NODE_TEST_EXECUTABLE=/fixture/inputs/node-v24.22.0-linux-x64/bin/node \
            -e PHILOTIC_REAL_ISSUER_FIXTURE=/fixture/fixture.cjs \
            -e PHILOTIC_REAL_ISSUER_BUNDLE=/fixture/authority/authority.cjs \
            native-issuer-userland sh -ec '
              test "$(cat /sys/fs/cgroup/memory.max)" = 2147483648
              test "$(cat /sys/fs/cgroup/pids.max)" = 256
              test "$(cat /sys/fs/cgroup/cpu.max)" = "200000 100000"
              printf "[Unit]\nDescription=Synthetic native hotel\n[Service]\nExecStart=/fixture/candidate/bin/aiua --hotel native-fixture\n" > /tmp/native-fixture.service
              mkdir /tmp/native-fixture.service.d
              cp /fixture/issuer/ops/ansible/lifegraph/native-hotel-limits.conf /tmp/native-fixture.service.d/limits.conf
              systemd-analyze verify /tmp/native-fixture.service
              exec /fixture/inputs/driver packaged_hotel_real_issuer_expired_preapproval_renewal --ignored --nocapture'
      - name: Synthetic proxy startup diagnostics
        if: failure()
        run: docker logs --tail 30 native-package-proxy
      - name: Preserve nonsecret package identities and resource evidence
        if: always()
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,subprocess,os
          files=['candidate/bin/aiua','candidate/bin/membrane-mcp','candidate/bin/native-memory','authority/authority.cjs','fixture.cjs','inputs/node-v24.22.0-linux-x64/bin/node']
          receipt={'runtime_source':os.environ['RUNTIME_SHA'],'harness_source':subprocess.check_output(['git','-C','hotel','rev-parse','HEAD'],text=True).strip(),'issuer_source':subprocess.check_output(['git','-C','issuer','rev-parse','HEAD'],text=True).strip(),'sha256':{p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in files if pathlib.Path(p).is_file()},'containers':{}}
          for name in ['native-package-runtime','native-package-mongo','native-package-graph','native-package-network','native-package-website','native-package-proxy']:
            r=subprocess.run(['docker','inspect',name],capture_output=True,text=True)
            if r.returncode: continue
            v=json.loads(r.stdout)[0]; h=v['HostConfig']
            receipt['containers'][name]={'image':v['Image'],'exit':v['State']['ExitCode'],'oom':v['State']['OOMKilled'],'memory':h['Memory'],'cpus':h['NanoCpus'],'pids':h['PidsLimit'],'logs':h['LogConfig'],'network_mode':h['NetworkMode'],'port_bindings':h['PortBindings']}
            assert not h['PortBindings']
            assert h['NetworkMode']=='native-package-bridge' if name in ['native-package-network','native-package-proxy'] else h['NetworkMode'].startswith('container:')
          network=json.loads(subprocess.check_output(['docker','network','inspect','native-package-bridge'],text=True))[0]
          assert network['Internal'];receipt['bridge_internal']=True
          pathlib.Path('native-package-evidence.json').write_text(json.dumps(receipt,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-preapproval-exact-issuer-evidence
          path: |
            native-package-evidence.json
            authority/identity.json
            authority/bundle-receipt.json
            authority/authority.cjs
          retention-days: 7
      - name: Remove only disposable CI fixtures
        if: always()
        run: |
          docker rm -f native-package-proxy native-package-website native-package-runtime native-package-mongo native-package-graph native-package-network || true
          docker network rm native-package-bridge || true
