name: Whole vault activation contract
on:
  push:
    branches: [codex/muninn-whole-vault-activation]
permissions:
  contents: read
jobs:
  public-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Test private provisioning decisions with dummy owner adapters
        run: python3 -m unittest discover -s services/personal-mcp/persistent-provisioning -v
      - name: Test gateway HTTP denial and exact whole-vault mapping
        shell: bash
        run: |
          set -euo pipefail
          runtime=''
          for candidate in /opt/hostedtoolcache/node/24.*/x64/bin/node /opt/hostedtoolcache/node/22.*/x64/bin/node; do
            if [[ -x "$candidate" ]]; then runtime="$candidate"; break; fi
          done
          test -n "$runtime"
          cd services/personal-mcp
          "$runtime" --test whole-vault.test.mjs whole-vault-http.test.mjs remote-clients.test.mjs gateway.test.mjs bootstrap.test.mjs
