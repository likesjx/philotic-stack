name: Native Memory Capture
on:
  pull_request:
    branches: [develop]
    paths:
      - 'crates/native-memory/**'
      - 'crates/membrane/**'
      - 'crates/membrane-mcp/**'
      - 'crates/ansible-mesh-core/**'
      - 'crates/aiua/**'
      - 'crates/data-memorygraphrag/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'release/packages.toml'
      - 'scripts/release-manifest.py'
      - 'scripts/release-packages.sh'
      - '.github/workflows/native-memory-capture.yml'
      - 'docs/architecture/outbound-egress-inventory.json'
      - 'scripts/check-outbound-egress-inventory.py'
      - 'scripts/tests/test_outbound_egress_inventory.py'
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Enforce outbound egress classifications and negative cases
        run: |
          python3 scripts/check-outbound-egress-inventory.py
          python3 -B -m unittest discover -s scripts/tests -p 'test_outbound_egress_inventory.py' -v
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: cargo fmt --check -p native-memory -p membrane -p membrane-mcp -p ansible-mesh-core
      - run: cargo test --locked -p native-memory -p membrane -p membrane-mcp
      - run: cargo test --locked -p ansible-mesh-core --lib
      - run: cargo test --locked -p aiua native_authority
      - run: cargo test --locked -p aiua manager_never_signals_stored_pid
      - run: cargo test --locked -p aiua concrete_child_retirement_and_replacement
      - run: cargo test --locked -p aiua native_preapproval
      - run: NODE_TEST_EXECUTABLE="$(command -v node)" cargo test --locked -p aiua sealed_node_bundle_survives_source_replacement_and_cannot_be_written -- --ignored --nocapture
      - run: cargo check --locked -p data-memorygraphrag --all-targets
      - run: cargo clippy --locked -p native-memory -p membrane -p membrane-mcp -p ansible-mesh-core --all-targets
      - name: Build disposable hotel composition
        run: cargo build --locked -p aiua -p native-memory
      - name: Real hotels and signed native runner through HTTP MCP
        run: PHILOTIC_TEST_BIN_DIR="$PWD/target/debug" cargo test --locked -p membrane-mcp real_hotels_native_runner_authenticated_mcp_composition -- --ignored --nocapture
  publisher-identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
      - uses: Swatinem/rust-cache@v2
      - name: Build the isolated test executable
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p native-memory --lib --no-run --message-format=json > "$RUNNER_TEMP/native-publisher-build.jsonl"
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          matches = []
          for line in Path(os.environ['RUNNER_TEMP'], 'native-publisher-build.jsonl').read_text().splitlines():
              item = json.loads(line)
              if (item.get('reason') == 'compiler-artifact' and
                  item.get('target', {}).get('name') == 'native_memory' and
                  item.get('profile', {}).get('test') and item.get('executable')):
                  matches.append(Path(item['executable']).resolve())
          target = (Path(os.environ['GITHUB_WORKSPACE']) / 'target').resolve()
          assert len(matches) == 1 and matches[0].is_relative_to(target) and os.access(matches[0], os.X_OK), matches
          Path(os.environ['RUNNER_TEMP'], 'native-publisher-test-path').write_text(str(matches[0]))
          PYCODE
      - name: Linux packet and stream identity tests
        run: cargo test --locked -p native-memory --lib protected_ -- --test-threads=1
      - name: Isolated descriptor and truncation tests
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(cat "$RUNNER_TEMP/native-publisher-test-path")"
          test_name="protected_transfer_candidate::tests::linux_isolated_rejects_rights_and_truncation_without_fd_leaks"
          "$test_bin" --list --ignored | grep -Fx "$test_name: test"
          "$test_bin" --exact "$test_name" --ignored --test-threads=1
      - name: Disposable root and dropped-UID test
        shell: bash
        run: |
          set -euo pipefail
          test_bin="$(cat "$RUNNER_TEMP/native-publisher-test-path")"
          test_name="protected_transfer_candidate::tests::real_linux_root_receiver_rejects_dropped_uid_child"
          "$test_bin" --list --ignored | grep -Fx "$test_name: test"
          sudo -n "$test_bin" --exact "$test_name" --ignored --test-threads=1
      - name: Disposable root service descendant containment experiment
        shell: bash
        run: |
          set -euo pipefail
          sudo -n env PHILOTIC_DISPOSABLE_SYSTEMD_TEST=1 /usr/bin/python3 scripts/tests/test_native_publisher_systemd_containment.py -v
  package-linux:
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGET: x86_64-unknown-linux-gnu
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      PHILOTIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.1'
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: native-memory-release-linux
      - name: Verify release tooling and build scoped binaries
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 -m unittest discover -s scripts/tests -p 'test_release*.py'
          scripts/release-packages.sh required-bins --platform linux | grep -Fx native-memory
          cargo build --locked --release --target "$TARGET" -p aiua -p native-memory -p membrane-mcp --bins
      - name: Assemble and verify candidate archive
        run: |
          set -euo pipefail
          mkdir -p stage/bin dist unpacked
          cp "target/$TARGET/release/aiua" "target/$TARGET/release/native-memory" "target/$TARGET/release/membrane-mcp" stage/bin/
          chmod 755 stage/bin/*
          # Candidate metadata only: this does not create a Git tag or release.
          TAG="v0.0.0-alpha.${GITHUB_RUN_NUMBER}"
          python3 scripts/release-manifest.py generate --dir stage --tag "$TAG" \
            --sha "$SOURCE_SHA" --target "$TARGET" --require aiua native-memory membrane-mcp
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          Path('stage/provenance.json').write_text(json.dumps({
              'kind': 'unreleased-native-memory-candidate',
              'sha': os.environ['SOURCE_SHA'],
              'target': os.environ['TARGET'],
              'workflow': '.github/workflows/native-memory-capture.yml',
              'run_url': f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
          }, indent=2) + '\n')
          PY
          NAME="native-memory-${SOURCE_SHA}-linux-x86_64"
          tar -C stage -czf "dist/$NAME.tar.gz" bin SHA256SUMS manifest.json provenance.json
          tar -C unpacked -xzf "dist/$NAME.tar.gz"
          python3 scripts/release-manifest.py verify --dir unpacked
          python3 scripts/release-manifest.py check-metadata --manifest unpacked/manifest.json --tag "$TAG" --target "$TARGET"
          (cd unpacked && sha256sum -c SHA256SUMS)
          cp stage/manifest.json stage/provenance.json dist/
          (cd dist && sha256sum *.tar.gz manifest.json provenance.json > SHA256SUMS)
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
      - name: Exercise unpacked release hotel and runner through test-built HTTP MCP
        run: |
          PHILOTIC_TEST_BIN_DIR="$PWD/unpacked/bin" cargo test --locked -p membrane-mcp real_hotels_native_runner_authenticated_mcp_composition -- --ignored --nocapture
          python3 scripts/release-manifest.py verify --dir unpacked
      - name: Exercise unpacked release guests with test-built hotel authority and synthetic issuer
        run: |
          set -euo pipefail
          trap 'docker rm -f native-release-memgraph >/dev/null 2>&1 || true' EXIT
          docker run -d --name native-release-memgraph --publish 127.0.0.1:17687:7687 \
            --cap-drop ALL --security-opt no-new-privileges --memory 2g --cpus 2 --pids-limit 256 \
            --log-opt max-size=10m --log-opt max-file=3 \
            memgraph/memgraph-mage@sha256:e8e03640071c57de6a13f2f4c5f9ed1789797dc5e8e771bbe62203b20e1b8c27 \
            --storage-wal-enabled=true --storage-wal-file-flush-every-n-tx=1 \
            --storage-snapshot-interval-sec=300 --storage-snapshot-on-exit=true --telemetry-enabled=false
          ready=false
          for attempt in {1..60}; do
            if docker exec -i native-release-memgraph mgconsole --host 127.0.0.1 --port 7687 <<< 'RETURN 1;' >/dev/null 2>&1; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          docker exec -i native-release-memgraph mgconsole --host 127.0.0.1 --port 7687 <<'CYPHER'
          CREATE CONSTRAINT ON (n:NativeMemoryObservation) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryReceipt) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryNonce) ASSERT n.key IS UNIQUE;
          CYPHER
          PHILOTIC_NATIVE_OAUTH_COMPOSITION=1 PHILOTIC_TEST_BIN_DIR="$PWD/unpacked/bin" \
            NODE_TEST_EXECUTABLE="$(command -v node)" cargo test --locked -p aiua \
            same_hotel_oauth_http_capture_recall_and_coordinated_revocation -- --ignored --nocapture
          python3 scripts/release-manifest.py verify --dir unpacked
      - uses: actions/upload-artifact@v4
        with:
          name: native-memory-linux-x86_64-${{ github.event.pull_request.head.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
