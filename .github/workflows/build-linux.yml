name: Synthetic broker exact-systemd rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthetic-broker-systemd-rehearsal
  cancel-in-progress: false
jobs:
  dummy-only:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/synthetic-broker-systemd-rehearsal-r3' && github.run_attempt == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Rehearse the approved exact archive and unit once
        working-directory: services/personal-mcp/synthetic-broker-build/systemd-rehearsal
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT /usr/bin/python3 rehearse.py --approved-disposable-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: broker-systemd-rehearsal-${{ github.sha }}
          path: services/personal-mcp/synthetic-broker-build/systemd-rehearsal/rehearsal-result.json
          if-no-files-found: warn
          retention-days: 7
