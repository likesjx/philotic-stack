name: Synthetic Docker cgroup observation
on:
  push:
    branches: [codex/synthetic-docker-cgroup-observation]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Run focused tests
        run: python3 -m unittest discover -s scripts/synthetic-cgroup -p 'test_*.py' -v
      - name: Observe synthetic container retirement
        run: python3 scripts/synthetic-cgroup/docker-cgroup-observation.py
