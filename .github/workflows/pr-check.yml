name: PR Check

# The gate that was missing. Before this workflow the only CI was
# build-linux.yml (push to develop — i.e. AFTER merge, and no tests) and
# release.yml (tags only). Nothing verified a pull request, while the standing
# policy is to auto-merge agent PRs into develop "at honest green" — a green
# that was entirely self-reported by the agent that wrote the code.
#
# Scope, deliberately:
#   test  — HARD gate. `cargo test --workspace` on macOS arm64, which is what
#           mac-jane and mbp-jane actually run. Linux is not an option here:
#           the workspace contains Apple-only crates, which is why
#           build-linux.yml builds a selective package set rather than
#           --workspace.
#   fmt   — HARD gate. `cargo fmt --all --check`. The files that had drifted
#           are formatted in the same PR that adds this, so it is green on
#           arrival.
#
# Clippy is deliberately NOT here. The workspace emits hundreds of warnings
# (aiua alone: 313), so a blocking clippy would be red on arrival and would
# only teach everyone to ignore the gate — and a non-blocking one would cost a
# second cold macOS compile for information nobody is required to act on.
# Reintroducing it is tracked by proposal:clippy-ratchet-workspace-lints:
# clean crates one at a time behind [workspace.lints], then add it blocking.
#
# On timeouts and cache: the first run of this workflow was cancelled at a
# 90-minute limit while still compiling test binaries, and because the job was
# cancelled the cargo cache was never saved — so the following run would have
# started cold too. The limit is now 180 minutes so a cold run can finish and
# populate the cache; warm runs are far quicker. There is no separate
# `cargo check` step because `cargo test` compiles everything it would have.
#
# Not covered yet (follow-up): a Linux compile check on PRs. build-linux.yml
# still only runs post-merge on develop, so a PR can break the vps-jane build
# and not find out until it lands. Adding it means reproducing that workflow's
# selective package set — `cargo test --workspace` will not work on Linux
# because of the Apple-only crates.

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch: {}

concurrency:
  group: pr-check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep build.rs on the placeholder-UI path. Setting PHILOTIC_DESKTOP_DIR
  # makes crates/philotic-web/build.rs shell out to npm and panic. Same
  # reasoning as build-linux.yml.
  RUST_BACKTRACE: 1
  # Belt-and-braces for audiopus_sys: if pkg-config somehow still misses Opus
  # and the crate falls back to building it from source, opus's bundled
  # CMakeLists declares `cmake_minimum_required(VERSION <3.5)`, which CMake 4
  # (on the runner and on the dev Macs) refuses outright. This lets that
  # configure step proceed instead of panicking the build script.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  test:
    name: test (macos arm64)
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Undeclared system dependency, surfaced by the first run of this
      # workflow. crates/membrane-discord depends on `opus`, whose -sys crate
      # first asks pkg-config for a system Opus and only builds from source if
      # that fails. The dev Macs have opus 1.6.1 from Homebrew, so the source
      # path never runs locally and the dependency was invisible. A bare runner
      # has neither, so it took the source path and died on CMake 4.
      - name: Install system dependencies (Opus)
        run: brew install opus pkg-config

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy

      # Restore/save are split rather than using actions/cache, so that a run
      # which fails or is cancelled still saves what it compiled. With the
      # combined action the post-step is skipped on anything but success, which
      # is how the first attempt here left the next run just as cold as itself.
      - name: Restore cargo cache
        id: cargo_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: macos-arm64-cargo-

      - name: Show toolchain in use
        run: |
          rustc --version
          cargo --version

      # No separate `cargo check` step: `cargo test` compiles everything it
      # would have, and on a cold runner the duplicate pass was a large part of
      # what pushed the first run past its limit.
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

      # always(): a red or timed-out run has still done most of the compiling,
      # and the next attempt should benefit from it.
      - name: Save cargo cache
        if: always() && steps.cargo_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('**/Cargo.lock') }}

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt

      # Cheap: rustfmt parses the workspace members, it does not build.
      - name: cargo fmt --all --check
        run: cargo fmt --all --check
