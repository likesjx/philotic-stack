name: Release

# Runbook: docs/process/RELEASE.md (proposal:release-train R3).
#
# Tag convention — tags need THREE numeric parts (`v0.2` never triggers):
#   v0.2.0              → stable release      — must be tagged on main
#   v0.2.0-rc.1         → release candidate   — must be tagged on develop
#   v0.2.0-alpha.1 / -beta.1 → pre-release    — must be tagged on develop
#
# Targets — exactly the fleet:
#   x86_64-unknown-linux-gnu  (ubuntu-24.04: glibc >= 2.38 for the ort
#                              prebuilt libs, matches vps-jane)
#   aarch64-apple-darwin      (macos-14: mac-jane, mbp-jane)
#
# Assets per release:
#   philotic-<tag>-<os>-<arch>.tar.gz          bin/*, SHA256SUMS, manifest.json
#   philotic-<tag>-<os>-<arch>.manifest.json   the same manifest, standalone
#                                              (scripts/verify-release.sh reads it)
#   SHA256SUMS                                 over the tarballs + manifests
# plus a build-provenance attestation per tarball
# (`gh attestation verify <tarball> -R likesjx/philotic-stack`).
#
# Package set: release/packages.toml via scripts/release-packages.sh.
# Desktop UI: the committed jaredlikes-desktop dist/ is staged when the
# DESKTOP_REPO_TOKEN secret exists; otherwise philotic-web embeds the
# placeholder UI. PHILOTIC_DESKTOP_DIR is never set (it runs the broken npm build).
# Homebrew tap: stable tags only; skipped with a notice when TAP_GITHUB_TOKEN
# is not configured.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"           # stable:     v1.0.0
      - "v[0-9]+.[0-9]+.[0-9]+-alpha.*"   # alpha:      v1.0.0-alpha.1
      - "v[0-9]+.[0-9]+.[0-9]+-beta.*"    # beta:       v1.0.0-beta.1
      - "v[0-9]+.[0-9]+.[0-9]+-rc.*"      # candidate:  v1.0.0-rc.1

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # audiopus_sys falls back to a bundled CMake build if pkg-config misses Opus;
  # that CMakeLists is rejected by CMake 4 without this (see pr-check.yml).
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  # ── Guard: enforce branch discipline ────────────────────────────────────────
  # Stable tags must come from main. Pre-release tags must come from develop.
  validate-branch:
    name: Validate tag source branch
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check branch for tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          IS_PRERELEASE=false
          [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]] && IS_PRERELEASE=true

          # Find which branches contain this tag's commit
          BRANCHES=$(git branch -r --contains "$GITHUB_SHA" | sed 's|origin/||' | tr -d ' ')

          if [ "$IS_PRERELEASE" = "false" ]; then
            if echo "$BRANCHES" | grep -qx "main"; then
              echo "✓ Stable tag $TAG is on main — OK"
            else
              echo "✗ Stable tag $TAG must be tagged from main."
              echo "  Branches containing this commit: $BRANCHES"
              exit 1
            fi
          else
            if echo "$BRANCHES" | grep -qx "develop"; then
              echo "✓ Pre-release tag $TAG is on develop — OK"
            else
              echo "✗ Pre-release tag $TAG must be tagged from develop."
              echo "  Branches containing this commit: $BRANCHES"
              exit 1
            fi
          fi

  # ── Build native binaries ────────────────────────────────────────────────────
  build:
    name: Build ${{ matrix.artifact }}
    needs: validate-branch
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            platform: linux
            artifact: linux-x86_64
          - target: aarch64-apple-darwin
            runner: macos-14
            platform: darwin
            artifact: darwin-arm64
    env:
      HAS_DESKTOP_TOKEN: ${{ secrets.DESKTOP_REPO_TOKEN != '' }}
      TARGET: ${{ matrix.target }}
      PLATFORM: ${{ matrix.platform }}
      ARTIFACT: ${{ matrix.artifact }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopus-dev pkg-config

      - name: Install system dependencies (macOS)
        if: matrix.platform == 'darwin'
        run: brew install opus pkg-config

      - name: Install Rust toolchain
        # Pinned to match rust-toolchain.toml; bump in lockstep with it.
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            release-${{ matrix.target }}-cargo-
            ${{ matrix.artifact }}-cargo-

      # Same staging as build-linux.yml: copy the private repo's COMMITTED
      # dist/ into crates/philotic-web/ui-dist (build.rs reuses it, no npm).
      - name: Check out jaredlikes-desktop (private UI)
        id: desktop_checkout
        if: env.HAS_DESKTOP_TOKEN == 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: likesjx/jaredlikes-desktop
          ref: main
          token: ${{ secrets.DESKTOP_REPO_TOKEN }}
          path: jaredlikes-desktop
          persist-credentials: false

      - name: Report desktop UI source
        env:
          DESKTOP_OUTCOME: ${{ steps.desktop_checkout.outcome }}
        run: |
          if [ "${HAS_DESKTOP_TOKEN}" != "true" ]; then
            echo "::notice::DESKTOP_REPO_TOKEN not configured — shipping philotic-web with the placeholder UI"
          elif [ "${DESKTOP_OUTCOME}" = "success" ]; then
            echo "::notice::desktop UI checked out — staging committed dist/"
          else
            echo "::warning::desktop checkout failed (token?) — shipping the placeholder UI"
          fi

      - name: Stage committed desktop dist into ui-dist
        if: steps.desktop_checkout.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -f jaredlikes-desktop/dist/index.html ]; then
            rm -rf crates/philotic-web/ui-dist
            mkdir -p crates/philotic-web/ui-dist
            cp -R jaredlikes-desktop/dist/. crates/philotic-web/ui-dist/
            echo "::notice::staged committed desktop dist into ui-dist"
          else
            echo "::warning::jaredlikes-desktop/dist/index.html missing — leaving ui-dist as-is (placeholder fallback)"
          fi

      - name: Build release binaries
        env:
          # Baked in via philotic_client::build_sha(); verify-release compares it.
          PHILOTIC_BUILD_SHA: ${{ github.sha }}
          PHILOTIC_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          read -r -a PKG_FLAGS <<< "$(scripts/release-packages.sh cargo-flags --platform "${PLATFORM}")"
          [ "${#PKG_FLAGS[@]}" -gt 0 ] || { echo "::error::release-packages.sh returned no packages"; exit 1; }
          echo "packages: ${PKG_FLAGS[*]}"
          cargo build --release --target "${TARGET}" --bins "${PKG_FLAGS[@]}"

      - name: Package tarball + manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NAME="philotic-${TAG}-${ARTIFACT}"
          SRC="target/${TARGET}/release"
          STAGE="stage/${NAME}"
          rm -rf stage dist && mkdir -p "${STAGE}/bin" dist

          mapfile -t BINS < <(scripts/release-packages.sh bins --platform "${PLATFORM}")
          mapfile -t REQUIRED < <(scripts/release-packages.sh required-bins --platform "${PLATFORM}")
          for bin in "${BINS[@]}"; do
            if [ -f "${SRC}/${bin}" ]; then
              cp "${SRC}/${bin}" "${STAGE}/bin/${bin}"
              chmod 755 "${STAGE}/bin/${bin}"
            else
              echo "::warning::optional binary not produced: ${bin}"
            fi
          done

          # Ad-hoc sign on macOS BEFORE hashing, so the manifest hashes are
          # of the signed bytes the Macs run (install-release-mac.sh re-signs
          # and records post-sign hashes if they differ).
          if [ "${PLATFORM}" = "darwin" ]; then
            for f in "${STAGE}"/bin/*; do codesign -f -s - "$f"; done
          fi

          python3 scripts/release-manifest.py generate --dir "${STAGE}" \
            --tag "${TAG}" --sha "${GITHUB_SHA}" --target "${TARGET}" \
            --require "${REQUIRED[@]}"
          python3 scripts/release-manifest.py verify --dir "${STAGE}" --check-aiua-version

          # manifest.json last: installers treat its presence as "fully unpacked".
          tar -C "${STAGE}" -czf "dist/${NAME}.tar.gz" bin SHA256SUMS manifest.json
          cp "${STAGE}/manifest.json" "dist/${NAME}.manifest.json"

          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  # ── Create GitHub Release ────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    outputs:
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      darwin_arm64_sha256: ${{ steps.sums.outputs.darwin_arm64 }}

    steps:
      - name: Release metadata
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "channel=$(echo "$TAG" | grep -oE '(alpha|beta|rc)' | head -1)" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Outer SHA256SUMS
        id: sums
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          cd release-assets
          for a in linux-x86_64 darwin-arm64; do
            for f in "philotic-${TAG}-${a}.tar.gz" "philotic-${TAG}-${a}.manifest.json"; do
              [ -f "$f" ] || { echo "::error::missing release asset $f"; exit 1; }
            done
          done
          sha256sum ./*.tar.gz ./*.manifest.json | sed 's#  \./#  #' > SHA256SUMS
          cat SHA256SUMS
          echo "darwin_arm64=$(awk -v f="philotic-${TAG}-darwin-arm64.tar.gz" '$2 == f {print $1}' SHA256SUMS)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: release-assets/*.tar.gz

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ steps.meta.outputs.is_prerelease }}
          name: >-
            ${{ steps.meta.outputs.is_prerelease == 'true'
              && format('{0} ({1})', github.ref_name, steps.meta.outputs.channel)
              || github.ref_name }}

  # ── Update Homebrew tap (stable releases only) ───────────────────────────────
  # Writes Formula/philotic-web.rb (the formula README.md documents) from the
  # darwin-arm64 tarball. Skips with a notice when TAP_GITHUB_TOKEN is absent.
  update-tap:
    name: Bump Homebrew formula (philotic-web)
    needs: release
    if: needs.release.outputs.is_prerelease == 'false'
    runs-on: ubuntu-24.04
    env:
      HAS_TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN != '' }}

    steps:
      - name: Check tap token
        id: gate
        run: |
          if [ "${HAS_TAP_TOKEN}" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TAP_GITHUB_TOKEN not configured — skipping Homebrew tap update for ${GITHUB_REF_NAME}"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update philotic-web formula
        if: steps.gate.outputs.enabled == 'true'
        env:
          TAG: ${{ github.ref_name }}
          ARM64_SHA: ${{ needs.release.outputs.darwin_arm64_sha256 }}
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${ARM64_SHA}" ] || { echo "::error::darwin-arm64 sha256 missing from release job outputs"; exit 1; }

          git clone "https://x-access-token:${GH_TOKEN}@github.com/likesjx/homebrew-philotic.git" tap
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p Formula

          python3 - <<'PYEOF'
          import os
          tag = os.environ["TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          sha = os.environ["ARM64_SHA"]
          url = f"https://github.com/likesjx/philotic-stack/releases/download/{tag}/philotic-{tag}-darwin-arm64.tar.gz"
          formula = f'''class PhiloticWeb < Formula
            desc "Philotic Stack: phil operator CLI and hotel runtime binaries"
            homepage "https://github.com/likesjx/philotic-stack"
            url "{url}"
            version "{version}"
            sha256 "{sha}"
            license "MIT"

            depends_on arch: :arm64
            depends_on :macos
            depends_on "opus"

            def install
              bin.install Dir["bin/*"]
              bin.install_symlink "philotic-web" => "phil"
            end

            test do
              system bin/"aiua", "--version"
            end
          end
          '''
          with open("Formula/philotic-web.rb", "w") as fh:
              fh.write(formula)
          PYEOF

          cat Formula/philotic-web.rb
          git add Formula/philotic-web.rb
          if git diff --cached --quiet; then
            echo "No changes to philotic-web formula — skipping commit"
          else
            git commit -m "philotic-web ${TAG}" -m "Release: https://github.com/likesjx/philotic-stack/releases/tag/${TAG}"
            git push
          fi
