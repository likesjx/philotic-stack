name: LifeGraph capture Memgraph acceptance

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'crates/data-memorygraphrag/**'
      - 'crates/native-memory/**'
      - 'crates/aiua/**'
      - 'crates/membrane-mcp/**'
      - 'scripts/native-memory-durable-smoke.sh'
      - 'crates/ansible-mesh-core/**'
      - 'crates/datasource/**'
      - 'crates/philotic-client/**'
      - 'vendor/neo4rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lifegraph-capture-memgraph-acceptance.yml'
  push:
    branches: [develop]
    paths:
      - 'crates/data-memorygraphrag/**'
      - 'crates/native-memory/**'
      - 'crates/aiua/**'
      - 'crates/membrane-mcp/**'
      - 'scripts/native-memory-durable-smoke.sh'
      - 'crates/ansible-mesh-core/**'
      - 'crates/datasource/**'
      - 'crates/philotic-client/**'
      - 'vendor/neo4rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lifegraph-capture-memgraph-acceptance.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: lifegraph-capture-memgraph-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  CARGO_TERM_COLOR: always
  PHILOTIC_BUILD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RUST_BACKTRACE: '1'
  MEMGRAPH_IMAGE: memgraph/memgraph-mage@sha256:e8e03640071c57de6a13f2f4c5f9ed1789797dc5e8e771bbe62203b20e1b8c27

jobs:
  capture-memgraph:
    name: synthetic capture real Memgraph (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.94.0'

      - name: Restore cargo cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lifegraph-capture-memgraph-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            lifegraph-capture-memgraph-

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Start disposable empty Memgraph
        run: |
          set -euo pipefail
          docker run -d --name lifegraph-capture-memgraph \
            --publish 127.0.0.1:17687:7687 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 1g \
            --cpus 1 \
            --pids-limit 128 \
            --tmpfs /var/lib/memgraph:rw,uid=101,gid=103 \
            --tmpfs /var/log/memgraph:rw,uid=101,gid=103 \
            "$MEMGRAPH_IMAGE" \
            --log-level=WARNING \
            --storage-wal-enabled=true \
            --storage-wal-file-flush-every-n-tx=1 \
            --storage-snapshot-interval-sec=300 \
            --storage-snapshot-on-exit=true \
            --telemetry-enabled=false

          ready=false
          for _ in {1..60}; do
            if docker exec -i lifegraph-capture-memgraph mgconsole --host 127.0.0.1 --port 7687 <<< 'RETURN 1;' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready" || { docker logs lifegraph-capture-memgraph; exit 1; }

      - name: Native signed observation transaction acceptance
        env:
          PHILOTIC_SYNTHETIC_NATIVE_MEMGRAPH: '1'
        run: cargo test --locked -p native-memory --test memgraph -- --ignored --test-threads=1

      - name: Build native graph recall composition
        run: cargo build --locked -p aiua -p data-memorygraphrag --bin aiua --bin life-graph-runner

      - name: Runner-owned definitions and hotel access policy over real UDS
        run: cargo test --locked -p aiua native_runner_tools -- --nocapture

      - name: Runner definitions through hotel, HTTP MCP, LifeGraph and real Memgraph
        env:
          PHILOTIC_GRAPH_TOOL_MEMGRAPH_FIXTURE: '1'
        run: PHILOTIC_TEST_BIN_DIR="$PWD/target/debug" cargo test --locked -p membrane-mcp real_native_graph_runner_memgraph_mcp_composition -- --ignored --nocapture

      - name: Pin current hotel and LifeGraph binaries for compatibility tests
        run: |
          mkdir -p "$RUNNER_TEMP/native-graph-current" "$RUNNER_TEMP/native-graph-old"
          cp target/debug/aiua target/debug/life-graph-runner "$RUNNER_TEMP/native-graph-current/"
          sha256sum "$RUNNER_TEMP/native-graph-current/aiua" "$RUNNER_TEMP/native-graph-current/life-graph-runner"

      - name: Checkout exact pre-descriptor compatibility baseline
        uses: actions/checkout@v4
        with:
          ref: d4ecb35fc1064c8281b42cda61d7927ab0d0cc15
          path: .native-graph-compat-baseline
          persist-credentials: false

      - name: Build and pin old binaries using the shared target
        working-directory: .native-graph-compat-baseline
        env:
          PHILOTIC_BUILD_SHA: d4ecb35fc1064c8281b42cda61d7927ab0d0cc15
        run: |
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo build --locked -p aiua -p data-memorygraphrag --bin aiua --bin life-graph-runner
          cp "$GITHUB_WORKSPACE/target/debug/aiua" "$GITHUB_WORKSPACE/target/debug/life-graph-runner" "$RUNNER_TEMP/native-graph-old/"
          sha256sum "$RUNNER_TEMP/native-graph-old/aiua" "$RUNNER_TEMP/native-graph-old/life-graph-runner"

      - name: Mixed old/new hotel and LifeGraph runner matrix
        env:
          PHILOTIC_GRAPH_TOOL_MEMGRAPH_FIXTURE: '1'
        run: |
          # Local crates from another source tree can share Cargo artifact names.
          # Rebuild current local dependencies without deleting the shared cache.
          touch crates/ansible-mesh-core/src/lib.rs
          PHILOTIC_TEST_BIN_DIR="$RUNNER_TEMP/native-graph-current" PHILOTIC_TEST_OLD_BIN_DIR="$RUNNER_TEMP/native-graph-old" cargo test --locked -p membrane-mcp real_native_graph_old_new_hotel_runner_binary_matrix -- --ignored --nocapture

      - name: Build native two-hotel composition
        run: cargo build --locked -p aiua -p native-memory -p membrane-mcp

      # The preceding fixture removes its constraints. Provision this fixture's
      # schema explicitly; the production runner never creates schema itself.
      - name: Prepare OAuth synthetic schema
        run: |
          docker exec -i lifegraph-capture-memgraph mgconsole --host 127.0.0.1 --port 7687 <<'CYPHER'
          CREATE CONSTRAINT ON (n:NativeMemoryObservation) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryReceipt) ASSERT n.key IS UNIQUE;
          CREATE CONSTRAINT ON (n:NativeMemoryNonce) ASSERT n.key IS UNIQUE;
          CYPHER

      - name: Hotel-owned OAuth capture, recall and coordinated revocation
        env:
          PHILOTIC_NATIVE_OAUTH_COMPOSITION: '1'
        run: NODE_TEST_EXECUTABLE="$(command -v node)" PHILOTIC_TEST_BIN_DIR="$PWD/target/debug" cargo test --locked -p aiua same_hotel_oauth_http_capture_recall_and_coordinated_revocation -- --ignored --nocapture

      - name: Retire OAuth synthetic schema
        run: |
          docker exec -i lifegraph-capture-memgraph mgconsole --host 127.0.0.1 --port 7687 <<'CYPHER'
          MATCH (n:NativeMemoryObservation) DELETE n;
          MATCH (n:NativeMemoryReceipt) DELETE n;
          MATCH (n:NativeMemoryNonce) DELETE n;
          DROP CONSTRAINT ON (n:NativeMemoryObservation) ASSERT n.key IS UNIQUE;
          DROP CONSTRAINT ON (n:NativeMemoryReceipt) ASSERT n.key IS UNIQUE;
          DROP CONSTRAINT ON (n:NativeMemoryNonce) ASSERT n.key IS UNIQUE;
          CYPHER

      - name: HTTP MCP through real hotels into Memgraph
        env:
          PHILOTIC_SYNTHETIC_NATIVE_COMPOSITION_MEMGRAPH: '1'
        run: PHILOTIC_TEST_BIN_DIR="$PWD/target/debug" cargo test --locked -p membrane-mcp real_hotels_native_runner_authenticated_mcp_composition -- --ignored --nocapture

      - name: Capture adapter, role edge, replay and operator close acceptance
        env:
          PHILOTIC_SYNTHETIC_CAPTURE_MEMGRAPH_ACCEPTANCE: '1'
        run: |
          cargo test --locked -p data-memorygraphrag \
            --test capture_memgraph_acceptance \
            capture_memgraph_then_explicit_operator_close_acceptance \
            -- --ignored --exact --test-threads=1

      - name: Stop disposable Memgraph
        if: always()
        run: docker rm -f lifegraph-capture-memgraph >/dev/null 2>&1 || true

      - name: Native snapshot and WAL abrupt restart qualification
        timeout-minutes: 15
        run: bash scripts/native-memory-durable-smoke.sh

      - name: Save cargo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lifegraph-capture-memgraph-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
