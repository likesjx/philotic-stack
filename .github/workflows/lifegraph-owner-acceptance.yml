name: LifeGraph owner synthetic acceptance
on:
  pull_request:
    branches: [develop, main, codex/lifegraph-authority-acceptance]
    paths:
      - 'crates/data-memorygraphrag/**'
      - 'crates/ansible-mesh-core/**'
      - 'services/personal-mcp/**'
      - 'vendor/neo4rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lifegraph-owner-acceptance.yml'
  push:
    branches: [develop, codex/muninn-native-fence]
    paths:
      - 'crates/data-memorygraphrag/**'
      - 'vendor/neo4rs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/lifegraph-owner-acceptance.yml'
permissions:
  contents: read
concurrency:
  group: lifegraph-owner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Build and test with pinned disposable Rust toolchain
        run: |
          mkdir -p .lifegraph-owner-target
          docker run --rm --cpus 2 --memory 3g \
            -v "$PWD:/src" -v "$PWD/.lifegraph-owner-target:/target" \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 \
            -e CARGO_PROFILE_TEST_DEBUG=0 -e CARGO_PROFILE_DEV_DEBUG=0 \
            -e RUSTC=/usr/local/rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc \
            -w /src rust@sha256:8e0f5926ce10ec99e12703b315c0043e4709d6bdc740dc1d28753e5fb87c766f \
            /usr/local/rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/cargo test --locked -p data-memorygraphrag --lib read_owner
      - name: Real supervisor executable and owned-child acceptance
        run: |
          docker run --rm --cpus 2 --memory 3g \
            -v "$PWD:/src" -v "$PWD/.lifegraph-owner-target:/target" \
            -e CARGO_TARGET_DIR=/target -e CARGO_INCREMENTAL=0 \
            -e CARGO_PROFILE_TEST_DEBUG=0 -e CARGO_PROFILE_DEV_DEBUG=0 \
            -e RUSTC=/usr/local/rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/rustc \
            -w /src rust@sha256:8e0f5926ce10ec99e12703b315c0043e4709d6bdc740dc1d28753e5fb87c766f \
            /usr/local/rustup/toolchains/1.94.0-x86_64-unknown-linux-gnu/bin/cargo test --locked -p data-memorygraphrag --test read_supervisor
      - name: Actual isolated synthetic Memgraph owner acceptance
        run: |
          binary=$(python3 - <<'PY'
          from pathlib import Path
          import os
          files=[p for p in Path('.lifegraph-owner-target/debug/deps').glob('data_memorygraphrag-*') if p.is_file() and os.access(p, os.X_OK)]
          if len(files)!=1: raise SystemExit('Ambiguous test artifact')
          print(files[0].resolve())
          PY
          )
          services/personal-mcp/lifegraph-owner-tests/run-disposable-bolt.sh --approved-fixture-run "$binary"
      - name: Record qualified native candidate identity
        run: |
          mkdir -p .muninn-fence-evidence
          git rev-parse HEAD > .muninn-fence-evidence/source.txt
          sha256sum .lifegraph-owner-target/debug/lifegraph-read-supervisor > .muninn-fence-evidence/supervisor.sha256
          cp .lifegraph-owner-target/debug/lifegraph-read-supervisor .muninn-fence-evidence/
      - uses: actions/upload-artifact@v4
        with:
          name: muninn-native-fence-candidate
          path: .muninn-fence-evidence/
          retention-days: 7
