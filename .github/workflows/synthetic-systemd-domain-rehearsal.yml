name: Synthetic systemd socket and domain rehearsal

on:
  push:
    branches: [codex/synthetic-systemd-domain-rehearsal]

permissions:
  contents: read

jobs:
  synthetic-custody:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master at review
        with:
          toolchain: "1.94.0"
      - name: Run unprivileged harness guards
        run: python3 -m unittest discover -s scripts/tests -p test_systemd_socket_rehearsal.py -v
      - name: Build isolated test binary as runner
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/synthetic-custody-target
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p ansible-mesh-core --lib --no-run --message-format=json > "$RUNNER_TEMP/synthetic-custody-build.json"
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path(os.environ['CARGO_TARGET_DIR']).resolve(strict=True)
          records = []
          with open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'synthetic-custody-build.json', encoding='utf-8') as stream:
              for line in stream:
                  obj = json.loads(line)
                  if obj.get('reason') == 'compiler-artifact' and obj.get('target', {}).get('name') == 'ansible_mesh_core' and obj.get('profile', {}).get('test') and obj.get('executable'):
                      records.append(pathlib.Path(obj['executable']))
          if len(records) != 1 or records[0].is_symlink():
              raise SystemExit('test binary selection uncertain')
          binary = records[0].resolve(strict=True)
          if not binary.is_file() or root not in binary.parents:
              raise SystemExit('test binary location uncertain')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'synthetic-custody-binary').write_text(str(binary), encoding='utf-8')
          PY
      - name: Run one root-owned synthetic filesystem fixture
        shell: bash
        run: |
          set -euo pipefail
          binary="$(cat "$RUNNER_TEMP/synthetic-custody-binary")"
          sha256sum "$binary"
          uname -r
          "$binary" --list --ignored | grep -Fx 'linux_custody_fixture::disposable_linux_filesystem_and_interruption: test'
          digest="$(sha256sum "$binary" | cut -d' ' -f1)"
          sudo -n env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted PHILOTIC_DISPOSABLE_SYSTEMD_SOCKET=1 RUNNER_TEMP="$RUNNER_TEMP" python3 scripts/tests/systemd_socket_rehearsal.py "$binary" "$digest" | tee "$RUNNER_TEMP/synthetic-systemd-result.txt"
          grep -Fx 'synthetic_socket_masked_during_domain_and_interruption=passed' "$RUNNER_TEMP/synthetic-systemd-result.txt"
          grep -Fx 'synthetic_systemd_cleanup=confirmed' "$RUNNER_TEMP/synthetic-systemd-result.txt"
