[package]
name = "philotic-sandbox"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "philotic-sandbox-worker"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
bincode = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

# Globbing for path pattern matching
glob = "0.3"

# UUID for request IDs
uuid = { version = "1", features = ["v4"] }

# Clap for CLI
clap = { version = "4", features = ["derive"] }

# Linux-specific (optional)
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.4"
libc = "0.2"

[dev-dependencies]
tempfile = "3"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
