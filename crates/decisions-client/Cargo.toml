[package]
name = "decisions-client"
version = "0.1.0"
edition = "2024"
description = "HTTP hop and vault-key loading for typed decisions (Jev via OpenRouter or native TypeSafe)"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
philotic-client = { path = "../philotic-client" }
anyhow = "1.0"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.42", features = ["rt", "macros", "net", "io-util", "time"] }

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
