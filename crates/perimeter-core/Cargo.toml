[package]
name = "perimeter-core"
version = "0.1.0"
edition = "2021"
description = "Hotel network security perimeter — ingress fence and egress gateway traits"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
tokio = { version = "1.42", features = ["sync"] }
tracing = "0.1"
