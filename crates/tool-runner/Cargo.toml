[package]
name = "tool-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
exec-guard = { path = "../exec-guard" }
memory-core = { path = "../memory-core" }
clap = { version = "4", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
philotic-sandbox = { path = "../philotic-sandbox" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
