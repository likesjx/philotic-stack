[package]
name = "native-memory"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
libc = "0.2"
neo4rs = "0.9.0-rc.9"
ed25519-dalek = "2"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
philotic-client = { path = "../philotic-client" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
