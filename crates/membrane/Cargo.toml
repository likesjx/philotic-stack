[package]
name = "membrane"
version = "0.1.0"
edition = "2024"

[lib]
name = "membrane"
path = "src/lib.rs"

[[bin]]
name = "membrane"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
philotic-client = { path = "../philotic-client" }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
