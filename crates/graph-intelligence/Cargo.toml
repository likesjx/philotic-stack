[package]
name = "graph-intelligence"
version = "0.1.0"
edition = "2021"
description = "Project context engine — scans Rust codebases into a queryable graph"
license = "MIT"

[dependencies]
anyhow = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
syn = { version = "2", features = ["full", "parsing", "visit"] }
quote = "1"
proc-macro2 = "1"
uuid = { version = "1.11", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2"
glob = "0.3"
regex = "1"
sha2 = "0.10"
hex = "0.4"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "macros", "signal", "sync"] }
tower-http = { version = "0.5", features = ["cors"] }
tokio-tungstenite = "0.24"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json"] }
tempfile = "3"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "macros", "signal", "sync", "time"] }
