[package]
name = "membrane-telegram"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
philotic-client = { path = "../philotic-client" }
pulldown-cmark = "0.13"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "signal", "process", "fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
