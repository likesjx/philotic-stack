[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
philotic-ipc = { path = "../philotic-ipc" }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
