[package]
name = "agent-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_core"
path = "src/lib.rs"

[[bin]]
name = "agent-core"
path = "src/main.rs"

[[bin]]
name = "agent-worker"
path = "src/bin/agent_worker.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["serde", "v4"] }
