[package]
name = "agent-datasource"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agent-datasource"
path = "src/main.rs"

[lib]
name = "agent_datasource"
path = "src/lib.rs"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
datasource = { path = "../datasource" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ulid = "1"
async-trait = "0.1.89"

[dev-dependencies]
tempfile = "3"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
