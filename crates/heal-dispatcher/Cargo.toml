[package]
name = "heal-dispatcher"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "heal-dispatcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ansible-mesh-core = { path = "../ansible-mesh-core" }
philotic-client = { path = "../philotic-client" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
