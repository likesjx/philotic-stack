[package]
name = "philotic-web"
version = "0.1.0"
edition = "2021"
description = "Operator CLI for the Philotic Web — manage aiua nodes, agents, and mesh topology"

[[bin]]
name = "philotic-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "macros", "process", "time", "io-util"] }
uuid = { version = "1.11", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
sha2 = "0.10"
glob = "0.3"
philotic-client = { path = "../philotic-client" }
