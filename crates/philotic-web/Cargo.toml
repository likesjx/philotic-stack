[package]
name = "philotic-web"
version = "0.1.0"
edition = "2021"
description = "Operator CLI for the Philotic Web — manage aiua nodes, agents, and mesh topology"

[[bin]]
name = "philotic-web"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dirs = "5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "macros", "process", "time", "io-util", "signal"] }
uuid = { version = "1.11", features = ["v4"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
base64 = "0.22"
sha2 = "0.10"
glob = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
tokio-tungstenite = "0.24"
rust-embed = { version = "8", features = ["mime-guess"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
philotic-client = { path = "../philotic-client" }
philotic-graph = { path = "../philotic-graph" }
graph-intelligence = { path = "../graph-intelligence" }
ansible-mesh-core = { path = "../ansible-mesh-core" }
inquire = "0.7"
