[package]
name = "membrane-mcp-client"
version = "0.1.0"
edition = "2021"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
philotic-client = { path = "../philotic-client" }
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
