[package]
name = "graph-datasource"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
datasource = { path = "../datasource" }
regex = "1.10"
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.0", features = ["v4"] }
