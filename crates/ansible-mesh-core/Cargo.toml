[package]
name = "ansible-mesh-core"
version = "0.1.0"
edition = "2021"
description = "Core mesh beacon types and transport"

[dependencies]
philotic-primitives-mesh = { path = "../philotic-primitives-mesh" }
aes-gcm = "0.10"

base64 = "0.22"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
bincode = "1.3"
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
cron = "0.12"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
log = "0.4"
rand = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
thiserror = "1.0"
tracing = "0.1"
ulid = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }

[dev-dependencies]
philotic-client = { path = "../philotic-client" }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
