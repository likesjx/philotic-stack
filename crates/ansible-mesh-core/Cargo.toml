[package]
name = "ansible-mesh-core"
version = "0.1.0"
edition = "2021"
description = "Core mesh beacon types and transport"

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "net", "sync", "macros"] }
bincode = "1.3"
anyhow = "1.0"
hmac = "0.12"
sha2 = "0.10"
log = "0.4"
tracing = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }

[dev-dependencies]
philotic-client = { path = "../philotic-client" }
rusqlite = { version = "0.37", features = ["bundled"] }
tempfile = "3"
