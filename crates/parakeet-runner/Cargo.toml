[package]
name = "parakeet-runner"
version = "0.1.0"
edition = "2021"

[lib]
name = "parakeet_runner"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
philotic-client = { path = "../philotic-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
