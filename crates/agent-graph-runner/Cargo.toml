[package]
name = "agent-graph-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ulid = "1"
