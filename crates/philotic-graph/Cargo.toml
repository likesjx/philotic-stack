[package]
name = "philotic-graph"
version = "0.1.0"
edition = "2021"
description = "SVER-aware project graph — process lifecycle, Muninn bridge, agent traceability"

[dependencies]
graph-intelligence = { path = "../graph-intelligence" }
memory-core = { path = "../memory-core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4"] }
tokio = { version = "1.42", features = ["rt", "rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
dirs = "5"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
