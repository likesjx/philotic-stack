[package]
name = "mlx-runner"
version = "0.1.0"
edition = "2021"

[lib]
name = "mlx_runner"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
futures = "0.3"
philotic-client = { path = "../philotic-client" }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
