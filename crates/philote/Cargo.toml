[package]
name = "philote"
version = "0.1.0"
edition = "2024"

[lib]
name = "agent_core"
path = "src/lib.rs"

[[bin]]
name = "philote"
path = "src/main.rs"

[[bin]]
name = "philote-worker"
path = "src/bin/agent_worker.rs"

[dependencies]
anyhow = "1.0"
ansible-mesh-core = { path = "../ansible-mesh-core" }
chrono = { version = "0.4", features = ["clock"] }
chrono-tz = "0.10"
data-memorygraphrag = { path = "../data-memorygraphrag" }
exec-guard = { path = "../exec-guard" }
media-prep = { path = "../media-prep" }
memory-core = { path = "../memory-core" }
clap = { version = "4.5", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "process"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.18", features = ["serde", "v4"] }
