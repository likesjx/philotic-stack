[package]
name = "media-prep"
version = "0.1.0"
edition = "2024"

[lib]
name = "media_prep"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["process", "io-util", "macros", "rt"] }
