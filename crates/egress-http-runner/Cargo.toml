[package]
name = "egress-http-runner"
version = "0.1.0"
edition = "2021"
description = "Bounded HTTP executor for Philotic integration bindings"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
philotic-client = { path = "../philotic-client" }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
