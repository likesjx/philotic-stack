[package]
name = "mesh-relay"
version = "0.1.0"
edition = "2024"
description = "Outbound-dial QUIC relay so hotels stay meshed through vps when the direct (Tailscale) path is down."

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
thiserror = "1"
tokio = { version = "1", features = ["io-util", "sync", "rt", "rt-multi-thread", "net", "macros"] }
tracing = "0.1"
base64 = "0.22"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"

[dev-dependencies]
rand = "0.8"
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "rt-multi-thread", "time"] }
