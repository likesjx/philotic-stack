[package]
name = "mesh-relay"
version = "0.1.0"
edition = "2024"
description = "Outbound-dial QUIC relay so hotels stay meshed through vps when the direct (Tailscale) path is down."

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
ed25519-dalek = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
rand = "0.8"
