[package]
name = "membrane-discord"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "membrane-discord"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
philotic-client = { path = "../philotic-client" }
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
opus = "0.3"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
byteorder = "1.5"
rand = "0.8"
