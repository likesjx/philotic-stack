[package]
name = "ansible"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
ansible-mesh-core = { path = "../ansible-mesh-core" }
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
philotic-client = { path = "../philotic-client" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.21.0", features = ["v4"] }
axum = { version = "0.7", features = ["multipart"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
sha2 = "0.10"
hex = "0.4"
webrtc = "0.17.1"
