[package]
name = "ansible"
version = "0.1.0"
edition = "2024"

[dependencies]
ansible-mesh-core = { path = "../ansible-mesh-core" }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
philotic-ipc = { path = "../philotic-ipc" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
tokio = { version = "1.42", features = ["rt-multi-thread", "macros", "net", "process", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.21.0", features = ["v4"] }
