[package]
name = "memory-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow       = "1.0"
async-trait  = "0.1"
futures      = "0.3"
reqwest      = { version = "0.12", features = ["json"] }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
tokio        = { version = "1.42", features = ["rt", "rt-multi-thread", "sync", "macros"] }
tracing      = "0.1"
uuid         = { version = "1.11", features = ["v4", "serde"] }
