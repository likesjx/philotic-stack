[package]
name = "data-memorygraphrag"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "life-graph-runner"
path = "src/main.rs"

[[bin]]
name = "lifegraph-read-supervisor"
path = "src/bin/lifegraph-read-supervisor.rs"

[lib]
name = "data_memorygraphrag"
path = "src/lib.rs"

[features]
default = []
# Dormant framework only; activation needs a separate authority review.
scripted-sensors = ["dep:rhai"]

[dependencies]
rhai = { version = "1", features = ["serde"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
ansible-mesh-core = { path = "../ansible-mesh-core" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["clock", "serde"] }
chrono-tz = "0.10"
datasource = { path = "../datasource" }
futures = "0.3"
philotic-client = { path = "../philotic-client" }
neo4rs = { version = "0.9.0-rc.9" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ulid = "1"
sha2 = "0.10"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Clippy ratchet: this crate is warning-free and must stay that way.
[lints]
workspace = true
