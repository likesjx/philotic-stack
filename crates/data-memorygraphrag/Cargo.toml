[package]
name = "data-memorygraphrag"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "life-graph-runner"
path = "src/main.rs"

[lib]
name = "data_memorygraphrag"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
datasource = { path = "../datasource" }
neo4rs = { version = "0.9.0-rc.9" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
ulid = "1"
